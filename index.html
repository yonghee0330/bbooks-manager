<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비북스 매니저</title>
<style>
/* ── 변수 ── */
:root {
  --navy: #0A1F44;
  --navy2: #152d5e;
  --navy3: #1e3f7a;
  --green: #1A6B3C;
  --bg: #f2f3f7;
  --card: #ffffff;
  --border: #e2e4ea;
  --text: #1a1e2e;
  --sub: #5a6075;
  --r: 10px;
  --sh: 0 2px 12px rgba(10,31,68,.09);
  --cat1: #8B6914; /* 공간 */
  --cat2: #1A6B3C; /* 홍보 */
  --cat3: #1A4F8B; /* 점주 */
  --cat4: #7B2D8B; /* 행사 */
  --cat5: #8B2020; /* 운영 */
  --cat6: #2B7B8B; /* 외부 */
  --cat7: #6B5B2B; /* 기획 */
  --p0: #dc2626;
  --p1: #d97706;
  --p2: #16a34a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── 헤더 ── */
#hdr {
  background: var(--navy);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 500;
  gap: 8px;
}
#hdr h1 { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .3px; white-space: nowrap; }
.hdr-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.btn-hdr {
  padding: 5px 11px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.btn-ghost { background: rgba(255,255,255,.13); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.btn-ghost:hover { background: rgba(255,255,255,.22); }
.btn-green { background: #e8f5ed; color: var(--green); }
.btn-green:hover { background: #d4eddb; }
.sync-wrap { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,.65); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; transition: background .3s; }
.dot.on { background: #4ade80; }

/* API 배너 제거 — Firebase 사용 */

/* ── 담당자 탭 ── */
#abar {
  background: var(--navy2);
  display: flex;
  gap: 4px;
  padding: 5px 16px;
}
.af {
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.65);
  background: transparent;
  transition: all .15s;
}
.af.on { background: #fff; color: var(--navy); border-color: #fff; }

/* ── 카테고리 탭 ── */
#catbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 16px;
}
#catbar::-webkit-scrollbar { height: 0; }
.ct {
  padding: 9px 13px;
  border-bottom: 2.5px solid transparent;
  cursor: pointer;
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}
.ct.on { border-bottom-color: var(--navy); color: var(--navy); font-weight: 700; }
.ct:hover:not(.on) { color: var(--text); }

/* ── 뷰 바 ── */
#vbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 16px;
  flex-wrap: wrap;
}
.vb {
  padding: 3px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--sub);
  transition: all .15s;
}
.vb.on { background: var(--navy); color: #fff; border-color: var(--navy); }
#vbar select {
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
  color: var(--text);
}
.ml { margin-left: auto; }
#searchInput {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  width: 140px;
}

/* ── 통계 ── */
#stats {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  min-width: 75px;
}
.stat-l { font-size: 10px; color: var(--sub); margin-bottom: 2px; }
.stat-v { font-size: 20px; font-weight: 800; color: var(--navy); }
.stat-v.red { color: var(--p0); }

/* ── 로딩 ── */
#loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,31,68,.5);
  z-index: 900;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 4px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 메인 영역 ── */
#main { min-height: calc(100vh - 200px); }

/* ── 캘린더 ── */
.calw { display: flex; }
.calm { flex: 1; padding: 14px 16px; min-width: 0; overflow-x: auto; }
.cal2 { display: flex; gap: 14px; min-width: 540px; }
.cmo { flex: 1; min-width: 260px; }
.cmo-ttl { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.cgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.cdow {
  background: var(--navy);
  color: rgba(255,255,255,.8);
  text-align: center;
  padding: 5px 0;
  font-size: 10px;
  font-weight: 700;
}
.cdow:first-child { color: #fca5a5; }
.cdow:last-child  { color: #93c5fd; }
.cday {
  background: #fff;
  min-height: 80px;
  padding: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background .1s;
}
.cday:hover { background: #eef2ff; }
.cday:hover::after {
  content: '+';
  position: absolute;
  bottom: 2px; right: 4px;
  font-size: 16px;
  color: #c7cde0;
  line-height: 1;
}
.cday.om { background: #f8f9fb; opacity: .45; cursor: default; pointer-events: none; }
.cday.today { background: #eff6ff; }
.cdn {
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.cday.sun .cdn { color: #dc2626; }
.cday.sat .cdn { color: #2563eb; }
.cdn-circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff !important;
  font-size: 11px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 9px;
  line-height: 1.35;
  padding: 1px 3px;
  border-radius: 3px;
  margin-bottom: 1px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.chip:hover { opacity: .82; }
.chip-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.7); flex-shrink: 0; }
.more { font-size: 9px; color: var(--sub); padding: 1px 2px; }

/* ── 날짜 미정 패널 ── */
.ndp {
  width: 210px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--card);
  display: flex;
  flex-direction: column;
}
.ndp-h {
  padding: 10px 12px 7px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ndp-h h3 { font-size: 12px; font-weight: 700; color: var(--navy); }
.ndp-h button {
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.ndlist { flex: 1; overflow-y: auto; padding: 6px; }
.ndc {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 9px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: box-shadow .15s;
}
.ndc:hover { box-shadow: var(--sh); }
.ndc-t { font-size: 11px; font-weight: 700; margin-bottom: 3px; line-height: 1.4; }
.ndc-m { display: flex; gap: 3px; flex-wrap: wrap; }

/* ── 주간뷰 ── */
.weekw { padding: 14px 16px; }
.wgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.wcol { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.wcol-h { background: var(--navy); color: #fff; text-align: center; padding: 5px 3px; font-size: 10px; font-weight: 700; }
.wcol-h.today { background: #2563eb; }
.wcol-b { padding: 5px; min-height: 100px; }
.wchip { font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; color: #fff; cursor: pointer; line-height: 1.4; }
.wchip:hover { opacity: .82; }

/* ── 일간뷰 / 목록뷰 ── */
.listw { padding: 14px 16px; }
.listw h3 { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
.tc {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: box-shadow .15s, border-color .15s;
}
.tc:hover { box-shadow: var(--sh); border-color: #c7cde0; }
.tc.done { opacity: .45; }
.tc.done .tc-t { text-decoration: line-through; }
.tc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.tc-b { flex: 1; min-width: 0; }
.tc-t { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.tc-m { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
.b-cat { color: #fff; }
.b-who { background: #e8f0ff; color: #1a4f8b; }
.b-st  { background: #f0f4f0; color: #1a4f1a; }
.b-st.s-진행중 { background: #dbeafe; color: #1e40af; }
.b-st.s-완료   { background: #dcfce7; color: #166534; }
.b-st.s-보류   { background: #fee2e2; color: #991b1b; }
.tc-date { font-size: 11px; color: var(--sub); margin-left: auto; flex-shrink: 0; white-space: nowrap; }
.tc-date.ov { color: var(--p0); font-weight: 700; }
.tc-memo { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
.empty { text-align: center; padding: 48px; color: var(--sub); font-size: 13px; }
.empty .ei { font-size: 36px; margin-bottom: 10px; }

/* ── 날짜 패널 (사이드) ── */
#dp {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 300px;
  background: var(--card);
  box-shadow: -4px 0 24px rgba(0,0,0,.12);
  z-index: 400;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
#dp.open { transform: translateX(0); }
.dp-head {
  background: var(--navy);
  color: #fff;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dp-head span { font-size: 14px; font-weight: 700; }
.dp-head button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; }
.dp-body { flex: 1; overflow-y: auto; padding: 10px; }
.dp-task { background: #f5f6fa; border-radius: 8px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer; }
.dp-task:hover { background: #eaecf5; }
.dp-task-t { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.dp-add {
  margin: 0 10px 12px;
  padding: 9px;
  border: 1.5px dashed #c7cde0;
  border-radius: 8px;
  background: none;
  color: var(--sub);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  width: calc(100% - 20px);
  transition: all .15s;
}
.dp-add:hover { border-color: var(--navy); color: var(--navy); background: #f0f4ff; }

/* ── 모달 ── */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.ov.hidden { display: none; }
.modal {
  background: var(--card);
  border-radius: 14px;
  padding: 22px;
  width: 100%;
  max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
}
.mod-t {
  font-size: 16px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mc { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--sub); line-height: 1; }
.fg { margin-bottom: 11px; }
.fg label { display: block; font-size: 10px; font-weight: 800; color: var(--sub); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .4px; }
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 13px;
  background: #fff;
  color: var(--text);
  font-family: inherit;
  transition: border-color .15s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--navy); }
.fg textarea { min-height: 68px; resize: vertical; }
.fg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ndchk { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 5px; cursor: pointer; color: var(--sub); }
.fa { display: flex; gap: 7px; justify-content: flex-end; margin-top: 18px; }
.btn { padding: 8px 18px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all .15s; }
.btn-p { background: var(--navy); color: #fff; }
.btn-p:hover { background: var(--navy3); }
.btn-s { background: #f0f1f5; color: var(--text); border: 1px solid var(--border); }
.btn-d { background: #dc2626; color: #fff; }
.btn-d:hover { background: #b91c1c; }

/* ── Info 모달 ── */
.info-sec { margin-bottom: 18px; }
.info-sec h4 { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.ii-list { display: flex; flex-direction: column; gap: 2px; }
.ii { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--border); font-size: 12px; transition: background .12s; }
.ii.ii-dragging { opacity: .45; }
.ii.ii-over { background: #eff4ff; border-radius: 6px; }
.ii-grip { flex-shrink: 0; padding: 0 2px; color: #9aa3b2; font-size: 14px; line-height: 1; cursor: grab; user-select: none; touch-action: none; }
.ii-grip:active { cursor: grabbing; color: var(--navy); }
.ii-l { color: var(--sub); min-width: 110px; flex-shrink: 0; font-size: 11px; }
.ii-v { flex: 1; word-break: break-all; }
.ii-v a { color: var(--navy); text-decoration: none; }
.ii-v a:hover { text-decoration: underline; }
.ieb { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--sub); padding: 1px; }
.ieb:hover { color: var(--navy); }
.iadd { margin-top: 8px; padding: 5px 12px; background: #eff4ff; border: 1px dashed #93b4f0; border-radius: 6px; color: var(--navy); font-size: 11px; font-weight: 700; cursor: pointer; }

/* ── 토스트 ── */
#toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: #111827;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 12px;
  z-index: 999;
  opacity: 0;
  transform: translateY(8px);
  transition: all .22s;
  pointer-events: none;
  max-width: 280px;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok  { background: #166534; }
#toast.err { background: #991b1b; }

/* ── 반응형 ── */
@media (max-width: 700px) {
  .cal2 { flex-direction: column; }
  .ndp { display: none; }
  .wgrid { grid-template-columns: repeat(4,1fr); }
  .fg-2 { grid-template-columns: 1fr; }
  #dp { width: 90vw; }
  #searchInput { width: 100px; }
}
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="loading"><div class="spinner"></div><span id="load-msg">불러오는 중...</span></div>

<!-- 헤더 -->
<div id="hdr">
  <h1>🟢 BBOOKS</h1>
  <div class="hdr-r">
    <button class="btn-hdr btn-ghost" onclick="openInfo()">📋 중요 정보</button>
    <button class="btn-hdr btn-green" onclick="openTask()">+ 업무 추가</button>
    <div class="sync-wrap">
      <div class="dot" id="dot"></div>
      <span id="conn-txt">연결 중...</span>
    </div>
  </div>
</div>



<!-- 담당자 -->
<div id="abar">
  <button class="af on" onclick="setA('전체',this)">전체</button>
  <button class="af"    onclick="setA('호세',this)">호세</button>
  <button class="af"    onclick="setA('써든리',this)">써든리</button>
</div>

<!-- 카테고리 탭 -->
<div id="catbar">
  <div class="ct on"  onclick="setCat('all',this)">✅ 전체</div>
  <div class="ct" onclick="setCat('📦 공간&환경',this)">📦 공간</div>
  <div class="ct" onclick="setCat('📣 홍보&마케팅',this)">📣 홍보</div>
  <div class="ct" onclick="setCat('🤝 점주&커뮤니티',this)">🤝 점주</div>
  <div class="ct" onclick="setCat('🎪 모임&행사',this)">🎪 행사</div>
  <div class="ct" onclick="setCat('💰 운영&행정',this)">💰 운영</div>
  <div class="ct" onclick="setCat('🔗 외부연결',this)">🔗 외부</div>
  <div class="ct" onclick="setCat('💡 기획&아이디어',this)">💡 기획</div>
</div>

<!-- 뷰 바 -->
<div id="vbar">
  <button class="vb on" onclick="setView('month',this)">월간</button>
  <button class="vb"    onclick="setView('week',this)">주간</button>
  <button class="vb"    onclick="setView('day',this)">일간</button>
  <button class="vb"    onclick="setView('list',this)">목록</button>
  <select id="sortSel" onchange="render()">
    <option value="due">마감일순</option>
    <option value="priority">중요도순</option>
    <option value="created">최신순</option>
  </select>
  <select id="stSel" onchange="render()">
    <option value="">전체 상태</option>
    <option>예정</option><option>진행중</option><option>완료</option><option>보류</option>
  </select>
  <input id="searchInput" type="text" placeholder="검색..." oninput="render()" class="ml"/>
</div>

<!-- 통계 -->
<div id="stats">
  <div class="stat"><div class="stat-l">전체</div><div class="stat-v" id="s0">0</div></div>
  <div class="stat"><div class="stat-l">진행중</div><div class="stat-v" id="s1">0</div></div>
  <div class="stat"><div class="stat-l">완료</div><div class="stat-v" id="s2">0</div></div>
  <div class="stat"><div class="stat-l">기한초과</div><div class="stat-v red" id="s3">0</div></div>
</div>

<!-- 메인 -->
<div id="main"></div>

<!-- 날짜 사이드 패널 -->
<div id="dp">
  <div class="dp-head">
    <span id="dp-ttl">-</span>
    <button onclick="closeDp()">✕</button>
  </div>
  <div class="dp-body" id="dp-body"></div>
  <button class="dp-add" id="dp-add">+ 이 날짜에 업무 추가</button>
</div>

<!-- 업무 모달 -->
<div class="ov hidden" id="taskMod">
  <div class="modal">
    <div class="mod-t"><span id="mod-ttl">업무 추가</span><button class="mc" onclick="closeTask()">✕</button></div>
    <input type="hidden" id="tid"/>
    <div class="fg"><label>제목 *</label><input id="tT" type="text" placeholder="업무 내용 입력"/></div>
    <div class="fg-2">
      <div class="fg"><label>카테고리</label>
        <select id="tC">
          <option value="">선택 안 함</option>
          <option value="📦 공간&환경">📦 공간&환경</option>
          <option value="📣 홍보&마케팅">📣 홍보&마케팅</option>
          <option value="🤝 점주&커뮤니티">🤝 점주&커뮤니티</option>
          <option value="🎪 모임&행사">🎪 모임&행사</option>
          <option value="💰 운영&행정">💰 운영&행정</option>
          <option value="🔗 외부연결">🔗 외부연결</option>
          <option value="💡 기획&아이디어">💡 기획&아이디어</option>
        </select>
      </div>
      <div class="fg"><label>담당자</label>
        <select id="tA"><option>호세</option><option>써든리</option><option>공동</option></select>
      </div>
    </div>
    <div class="fg-2">
      <div class="fg"><label>중요도</label>
        <select id="tP">
          <option value="🔴 긴급">🔴 긴급</option>
          <option value="🟡 중요">🟡 중요</option>
          <option value="🟢 일반" selected>🟢 일반</option>
        </select>
      </div>
      <div class="fg"><label>진행상태</label>
        <select id="tS"><option>예정</option><option>진행중</option><option>완료</option><option>보류</option></select>
      </div>
    </div>
    <div class="fg-2">
      <div class="fg"><label>예상 소요시간</label><input id="tH" type="text" placeholder="예: 2시간"/></div>
      <div class="fg">
        <label>예상완료일</label>
        <input id="tD" type="date"/>
        <label class="ndchk"><input id="tND" type="checkbox" onchange="togND()"/> 날짜 미정</label>
      </div>
    </div>
    <div class="fg"><label>진행 메모</label><textarea id="tM" placeholder="진행상황, 참고사항 등"></textarea></div>
    <div class="fa">
      <button class="btn btn-d" id="tDel" onclick="delTask()" style="display:none;margin-right:auto">삭제</button>
      <button class="btn btn-s" onclick="closeTask()">취소</button>
      <button class="btn btn-p" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- 중요정보 모달 -->
<div class="ov hidden" id="infoMod">
  <div class="modal" style="max-width:580px">
    <div class="mod-t"><span>📋 비북스 중요 정보</span><button class="mc" onclick="closeInfo()">✕</button></div>
    <div id="info-body"></div>
    <div class="fa">
      <button class="btn btn-s" onclick="closeInfo()">닫기</button>
      <button class="btn btn-p" onclick="saveInfo()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
// ══════════════════════════════════════════════════════════════
//  🟢 BBOOKS MANAGER — Firebase Firestore 연동
// ══════════════════════════════════════════════════════════════
import { initializeApp }                      from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, doc,
         addDoc, updateDoc, deleteDoc,
         setDoc, getDoc, getDocs,
         onSnapshot, query, orderBy,
         serverTimestamp }                    from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

// ── Firebase 설정 ─────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            'AIzaSyBM_OKHPFnItC0HWMk7qc3JD3TL7BVv3DQ',
  authDomain:        'bbooks-manager.firebaseapp.com',
  projectId:         'bbooks-manager',
  storageBucket:     'bbooks-manager.firebasestorage.app',
  messagingSenderId: '413400855182',
  appId:             '1:413400855182:web:e30f948bade11180660fdf'
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── 상수 ──────────────────────────────────────────────────────
const CAT_COLOR = {
  '📦 공간&환경':'#8B6914','📣 홍보&마케팅':'#1A6B3C',
  '🤝 점주&커뮤니티':'#1A4F8B','🎪 모임&행사':'#7B2D8B',
  '💰 운영&행정':'#8B2020','🔗 외부연결':'#2B7B8B','💡 기획&아이디어':'#6B5B2B'
};
const P_COLOR = {'🔴 긴급':'#dc2626','🟡 중요':'#d97706','🟢 일반':'#16a34a'};
const P_ORDER = {'🔴 긴급':0,'🟡 중요':1,'🟢 일반':2};
const DOW = ['일','월','화','수','목','금','토'];
const MON = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

const DEFAULT_INFO = {
  docs:[
    {label:'사업자등록증', val:'파일 위치 또는 링크 입력'},
    {label:'통장사본',     val:'파일 위치 또는 링크 입력'},
    {label:'사업자번호',   val:'697-05-03470'}
  ],
  links:[
    {label:'비북스 인스타',        val:'https://instagram.com/b_books2026'},
    {label:'비모임 사이트',         val:'https://moim.bbooks.co.kr'},
    {label:'비모임 참가자 명단',    val:'https://docs.google.com/spreadsheets/d/1C64dZrpedaMX26oPPwDOkG1SJ-IvfADnIH5loE-qYQ4/htmlview'},
    {label:'얼굴패스(입구관리)',    val:'https://portal.heygreet.cloud/ko/login'},
    {label:'소상공인24',            val:'https://sso.sbiz24.kr/'},
    {label:'문화누리카드 신청',     val:'https://www.mnuri.kr/merchmt/merchmtInsert.do'},
    {label:'부천페이 가맹점',       val:'https://gmoney.or.kr/base/gmoney/apply/list'},
    {label:'경기도서관 독서포인트', val:'https://www.library.kr/ggl'}
  ],
  accounts:[
    {label:'카카오뱅크',       val:'3333-3725-33252 (비북스)'},
    {label:'부천페이',         val:'9465-4443-2235-8945'},
    {label:'사업자번호',       val:'697-05-03470'},
    {label:'토스 매장고유번호',val:'2008193578'}
  ]
};

// ── 상태 ──────────────────────────────────────────────────────
let tasks   = [];     // Firestore 실시간 동기화
let infoData = null;
let selDate  = null;
let editId   = null;
let curA     = '전체';
let curCat   = 'all';
let curView  = 'month';
let unsubTasks = null; // 실시간 리스너 해제 함수

// ── 초기화 ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initFirestore();
});

async function initFirestore() {
  // 연결 상태 표시
  setConnected(false);

  // tasks 실시간 구독
  const q = query(collection(db, 'tasks'), orderBy('createdAt', 'asc'));
  unsubTasks = onSnapshot(q, snap => {
    tasks = [];
    snap.forEach(d => tasks.push({ id: d.id, ...d.data() }));
    setConnected(true);
    render();
    stats();
  }, err => {
    setConnected(false);
    toast('Firestore 연결 오류: ' + err.message, 'err');
  });

  // 중요 정보 로드
  await loadInfo();
}

function setConnected(on) {
  const dot = g('dot'), txt = g('conn-txt');
  dot.className = 'dot' + (on ? ' on' : '');
  txt.textContent = on ? '실시간 연결됨' : '연결 중...';
}

// ── 중요 정보 ────────────────────────────────────────────────
async function loadInfo() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'info'));
    if (snap.exists()) {
      infoData = snap.data().content;
    } else {
      infoData = clone(DEFAULT_INFO);
    }
  } catch(e) {
    infoData = clone(DEFAULT_INFO);
  }
}

// ── 필터 / 정렬 ──────────────────────────────────────────────
window.setA = function(a, el) {
  curA = a;
  qsa('.af').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
};
window.setCat = function(c, el) {
  curCat = c;
  qsa('.ct').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
};
window.setView = function(v, el) {
  curView = v;
  qsa('.vb').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
};

function filtered() {
  const st  = g('stSel').value;
  const so  = g('sortSel').value;
  const q   = g('searchInput').value.toLowerCase();
  const today = td();

  let f = tasks.filter(t => {
    if (curA !== '전체' && t.assignee !== curA) return false;
    if (curCat !== 'all' && t.category !== curCat) return false;
    if (st && t.status !== st) return false;
    if (q && !t.title.toLowerCase().includes(q) && !(t.memo||'').toLowerCase().includes(q)) return false;
    return true;
  });

  f.sort((a, b) => {
    if (so === 'priority') return (P_ORDER[a.priority]||2) - (P_ORDER[b.priority]||2);
    if (so === 'due')      return (a.due_date||'z').localeCompare(b.due_date||'z');
    // 최신순: createdAt Timestamp 비교
    const ta = a.createdAt?.toMillis?.() ?? 0;
    const tb = b.createdAt?.toMillis?.() ?? 0;
    return tb - ta;
  });
  return f;
}

function stats() {
  const today = td();
  const f = filtered();
  g('s0').textContent = f.length;
  g('s1').textContent = f.filter(t => t.status === '진행중').length;
  g('s2').textContent = f.filter(t => t.status === '완료').length;
  g('s3').textContent = f.filter(t => t.due_date && t.due_date < today && t.status !== '완료').length;
}

// ── 렌더링 진입점 ────────────────────────────────────────────
function render() {
  stats();
  if (curView === 'month')     renderMonth();
  else if (curView === 'week') renderWeek();
  else if (curView === 'day')  renderDay();
  else                         renderList(filtered());
}
window.render = render;

// ── 월간 캘린더 ──────────────────────────────────────────────
function renderMonth() {
  const now = new Date();
  const y1 = now.getFullYear(), m1 = now.getMonth();
  let m2 = m1 + 1, y2 = y1;
  if (m2 > 11) { m2 = 0; y2++; }

  const dated  = filtered().filter(t =>  t.due_date);
  const nodate = filtered().filter(t => !t.due_date);

  g('main').innerHTML =
    '<div class="calw">' +
    '<div class="calm"><div class="cal2">' +
    buildMo(y1, m1, dated) +
    buildMo(y2, m2, dated) +
    '</div></div>' +
    '<div class="ndp">' +
    '<div class="ndp-h"><h3>📌 날짜 미정 (' + nodate.length + ')</h3>' +
    '<button onclick="openTask(null,true)">+</button></div>' +
    '<div class="ndlist">' + nodate.map(ndCard).join('') + '</div>' +
    '</div></div>';
}

function buildMo(yr, mo, dated) {
  const fd  = new Date(yr, mo, 1).getDay();
  const ld  = new Date(yr, mo+1, 0).getDate();
  const pld = new Date(yr, mo, 0).getDate();
  const today = td();
  let cells = '';

  for (let i = fd-1; i >= 0; i--)
    cells += '<div class="cday om"><div class="cdn">' + (pld-i) + '</div></div>';

  for (let d = 1; d <= ld; d++) {
    const ds  = yr + '-' + p2(mo+1) + '-' + p2(d);
    const dow = new Date(yr, mo, d).getDay();
    const isT = ds === today;
    const dt  = dated.filter(t => t.due_date === ds);
    const chips = dt.slice(0, 3).map(t => {
      const bg = CAT_COLOR[t.category] || '#555';
      return '<div class="chip" style="background:' + bg + '" ' +
        'onclick="event.stopPropagation();openTask(\'' + esc(t.id) + '\')" ' +
        'title="' + esc(t.title) + '">' +
        '<span class="chip-dot"></span>' +
        esc(t.title.slice(0,12)) + (t.title.length > 12 ? '…' : '') +
        '</div>';
    }).join('');
    const more  = dt.length > 3 ? '<div class="more">+' + (dt.length-3) + '개 더</div>' : '';
    const numH  = isT ? '<span class="cdn-circle">' + d + '</span>' : d;

    cells += '<div class="cday' +
      (isT ? ' today' : '') +
      (dow===0 ? ' sun' : dow===6 ? ' sat' : '') +
      '" onclick="openDp(\'' + ds + '\')">' +
      '<div class="cdn">' + numH + '</div>' +
      chips + more + '</div>';
  }

  const total = Math.ceil((fd + ld) / 7) * 7;
  for (let x = 1; x <= total - (fd + ld); x++)
    cells += '<div class="cday om"><div class="cdn">' + x + '</div></div>';

  return '<div class="cmo"><div class="cmo-ttl">' + yr + '년 ' + MON[mo] + '</div>' +
    '<div class="cgrid">' +
    DOW.map(d => '<div class="cdow">' + d + '</div>').join('') +
    cells + '</div></div>';
}

function ndCard(t) {
  const bg = CAT_COLOR[t.category] || '#666';
  return '<div class="ndc" onclick="openTask(\'' + esc(t.id) + '\')">' +
    '<div class="ndc-t">' + esc(t.title) + '</div>' +
    '<div class="ndc-m">' +
    (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
    '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
    '<span style="font-size:10px;color:' + (P_COLOR[t.priority]||'#888') + '">' + esc(t.priority) + '</span>' +
    '</div></div>';
}

// ── 주간 뷰 ──────────────────────────────────────────────────
function renderWeek() {
  const now = new Date();
  const sw  = new Date(now); sw.setDate(now.getDate() - now.getDay());
  const days = [];
  for (let i = 0; i < 7; i++) { const dd = new Date(sw); dd.setDate(sw.getDate()+i); days.push(dd); }
  const today = td();
  const dated = filtered().filter(t => t.due_date);

  const cols = days.map(dd => {
    const ds  = dd.toISOString().slice(0,10);
    const dow = dd.getDay();
    const isT = ds === today;
    const dt  = dated.filter(t => t.due_date === ds);
    return '<div class="wcol">' +
      '<div class="wcol-h' + (isT?' today':'') + '">' +
      DOW[dow] + '<br>' + (dd.getMonth()+1) + '/' + dd.getDate() +
      '</div><div class="wcol-b">' +
      dt.map(t => {
        const bg = CAT_COLOR[t.category] || '#555';
        return '<div class="wchip" style="background:' + bg + '" onclick="openTask(\'' + esc(t.id) + '\')">' +
          esc(t.title.slice(0,16)) + (t.title.length>16?'…':'') + '</div>';
      }).join('') +
      '</div></div>';
  }).join('');

  g('main').innerHTML = '<div class="weekw"><div class="wgrid">' + cols + '</div></div>';
}

// ── 일간 뷰 ──────────────────────────────────────────────────
function renderDay() {
  const today = td();
  const dt = filtered().filter(t => t.due_date === today);
  g('main').innerHTML = '<div class="listw"><h3>📅 오늘 (' + today + ')</h3>' +
    (dt.length ? dt.map(taskCard).join('') : '<div class="empty"><div class="ei">✅</div>오늘 업무가 없습니다</div>') +
    '</div>';
}

// ── 목록 뷰 ──────────────────────────────────────────────────
function renderList(list) {
  g('main').innerHTML = '<div class="listw">' +
    (list.length ? list.map(taskCard).join('') : '<div class="empty"><div class="ei">📭</div>업무가 없습니다</div>') +
    '</div>';
}

function taskCard(t) {
  const bg   = CAT_COLOR[t.category] || '#888';
  const pc   = P_COLOR[t.priority] || '#888';
  const ov   = t.due_date && t.due_date < td() && t.status !== '완료';
  return '<div class="tc' + (t.status==='완료'?' done':'') + '" onclick="openTask(\'' + esc(t.id) + '\')">' +
    '<div class="tc-dot" style="background:' + pc + '"></div>' +
    '<div class="tc-b">' +
    '<div class="tc-t">' + esc(t.title) + '</div>' +
    '<div class="tc-m">' +
    (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
    '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
    '<span class="badge b-st s-' + t.status + '">' + esc(t.status) + '</span>' +
    (t.estimated_hours ? '<span class="badge" style="background:#f0f4f0;color:#555">⏱ ' + esc(t.estimated_hours) + '</span>' : '') +
    '</div>' +
    (t.memo ? '<div class="tc-memo">' + esc(t.memo).slice(0,90) + (t.memo.length>90?'…':'') + '</div>' : '') +
    '</div>' +
    (t.due_date
      ? '<div class="tc-date' + (ov?' ov':'') + '">' + t.due_date + (ov?' ⚠':'') + '</div>'
      : '<div class="tc-date" style="color:#bbb">미정</div>') +
    '</div>';
}

// ── 날짜 사이드 패널 ─────────────────────────────────────────
window.openDp = function(ds) {
  selDate = ds;
  g('dp-ttl').textContent = ds;
  const ts = filtered().filter(t => t.due_date === ds);
  g('dp-body').innerHTML = ts.length === 0
    ? '<p style="padding:12px;color:var(--sub);font-size:12px">이 날짜에 업무가 없습니다.<br>아래 버튼으로 추가하세요.</p>'
    : ts.map(t => {
        const bg = CAT_COLOR[t.category] || '#888';
        return '<div class="dp-task" onclick="openTask(\'' + esc(t.id) + '\')">' +
          '<div class="dp-task-t">' + esc(t.title) + '</div>' +
          '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px">' +
          (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
          '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
          '<span class="badge b-st s-' + t.status + '">' + esc(t.status) + '</span>' +
          '</div>' +
          (t.memo ? '<div style="font-size:10px;color:var(--sub);margin-top:3px">' + esc(t.memo).slice(0,60) + '</div>' : '') +
          '</div>';
      }).join('');
  g('dp-add').onclick = () => openTask(null, false, ds);
  g('dp').classList.add('open');
};
window.closeDp = function() { g('dp').classList.remove('open'); selDate = null; };

// ── 업무 모달 ─────────────────────────────────────────────────
window.openTask = function(id, noDate, prefDate) {
  noDate = !!noDate; prefDate = prefDate || '';
  editId = id || null;
  g('taskMod').classList.remove('hidden');

  if (id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    g('mod-ttl').textContent = '업무 수정';
    g('tid').value  = t.id;
    g('tT').value   = t.title || '';
    g('tC').value   = t.category || '';
    g('tA').value   = t.assignee || '호세';
    g('tP').value   = t.priority || '🟢 일반';
    g('tS').value   = t.status   || '예정';
    g('tH').value   = t.estimated_hours || '';
    g('tD').value   = t.due_date || '';
    g('tND').checked  = !t.due_date;
    g('tD').disabled  = !t.due_date;
    g('tM').value   = t.memo || '';
    g('tDel').style.display = 'block';
  } else {
    g('mod-ttl').textContent = '업무 추가';
    g('tid').value  = '';
    g('tT').value   = '';
    g('tC').value   = (curCat !== 'all') ? curCat : '';
    g('tA').value   = (curA !== '전체') ? curA : '호세';
    g('tP').value   = '🟢 일반';
    g('tS').value   = '예정';
    g('tH').value   = '';
    g('tD').value   = prefDate;
    g('tND').checked  = noDate || !prefDate;
    g('tD').disabled  = noDate || !prefDate;
    g('tM').value   = '';
    g('tDel').style.display = 'none';
  }
};
window.closeTask = function() { g('taskMod').classList.add('hidden'); editId = null; };
window.togND = function() {
  g('tD').disabled = g('tND').checked;
  if (g('tND').checked) g('tD').value = '';
};

window.saveTask = async function() {
  const title = g('tT').value.trim();
  if (!title) { toast('제목을 입력하세요', 'err'); return; }
  const nd = g('tND').checked;
  const isEdit = !!g('tid').value;

  const data = {
    title,
    category:        g('tC').value,
    assignee:        g('tA').value,
    priority:        g('tP').value,
    status:          g('tS').value,
    estimated_hours: g('tH').value,
    due_date:        nd ? '' : g('tD').value,
    memo:            g('tM').value,
    updatedAt:       serverTimestamp(),
  };

  try {
    if (isEdit) {
      await updateDoc(doc(db, 'tasks', g('tid').value), data);
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, 'tasks'), data);
    }
    closeTask();
    if (selDate) openDp(selDate);
    toast('저장됐습니다 ✓', 'ok');
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
};

window.delTask = async function() {
  if (!confirm('정말 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, 'tasks', g('tid').value));
    closeTask(); closeDp();
    toast('삭제됐습니다', 'ok');
  } catch(e) {
    toast('삭제 실패: ' + e.message, 'err');
  }
};

// ── 중요 정보 모달 ────────────────────────────────────────────
window.openInfo = function() {
  if (!infoData) infoData = clone(DEFAULT_INFO);
  renderInfoBody();
  g('infoMod').classList.remove('hidden');
};
window.closeInfo = function() { g('infoMod').classList.add('hidden'); };

window.saveInfo = async function() {
  try {
    await setDoc(doc(db, 'settings', 'info'), {
      content: infoData,
      updatedAt: serverTimestamp()
    });
    closeInfo();
    toast('중요 정보 저장됐습니다 ✓', 'ok');
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
};

function renderInfoBody() {
  const secs = [
    { k:'docs',     t:'📄 자주 쓰는 서류' },
    { k:'links',    t:'🔗 자주 접속하는 사이트' },
    { k:'accounts', t:'💳 계좌 & 결제 정보' },
  ];
  g('info-body').innerHTML = secs.map(s =>
    '<div class="info-sec"><h4>' + s.t + '</h4>' +
    '<div class="ii-list" data-section="' + s.k + '">' +
    (infoData[s.k]||[]).map((item, i) =>
      '<div class="ii" id="ii-' + s.k + '-' + i + '" draggable="true" data-section="' + s.k + '" data-index="' + i + '">' +
      '<span class="ii-grip" title="드래그하여 순서 변경">⠿</span>' +
      '<span class="ii-l">' + esc(item.label) + '</span>' +
      '<span class="ii-v">' +
      (item.val && item.val.startsWith('http')
        ? '<a href="' + esc(item.val) + '" target="_blank">' + esc(item.val.length > 38 ? item.val.slice(0,38)+'…' : item.val) + '</a>'
        : esc(item.val)) +
      '</span>' +
      '<button class="ieb" type="button" onclick="editII(\'' + s.k + '\',' + i + ')">✏️</button>' +
      '</div>'
    ).join('') +
    '</div>' +
    '<button class="iadd" type="button" onclick="addII(\'' + s.k + '\')">+ 항목 추가</button>' +
    '</div>'
  ).join('');
  initInfoDragDrop();
}

let infoDrag = null;

function initInfoDragDrop() {
  qsa('.ii-list .ii').forEach(row => {
    row.addEventListener('dragstart', onInfoDragStart);
    row.addEventListener('dragend', onInfoDragEnd);
    row.addEventListener('dragover', onInfoDragOver);
    row.addEventListener('dragleave', onInfoDragLeave);
    row.addEventListener('drop', onInfoDrop);
  });
}

function onInfoDragStart(e) {
  if (!e.target.closest('.ii-grip')) {
    e.preventDefault();
    return;
  }
  const row = e.currentTarget;
  infoDrag = { section: row.dataset.section, from: Number(row.dataset.index) };
  row.classList.add('ii-dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', infoDrag.section);
}

function onInfoDragEnd() {
  qsa('.ii').forEach(row => row.classList.remove('ii-dragging', 'ii-over'));
  infoDrag = null;
}

function onInfoDragOver(e) {
  if (!infoDrag) return;
  const row = e.currentTarget;
  if (row.dataset.section !== infoDrag.section) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  qsa('.ii[data-section="' + infoDrag.section + '"]').forEach(r => r.classList.remove('ii-over'));
  row.classList.add('ii-over');
}

function onInfoDragLeave(e) {
  const row = e.currentTarget;
  if (!row.contains(e.relatedTarget)) row.classList.remove('ii-over');
}

function onInfoDrop(e) {
  e.preventDefault();
  if (!infoDrag) return;
  const row = e.currentTarget;
  const section = row.dataset.section;
  const to = Number(row.dataset.index);
  const from = infoDrag.from;
  if (section !== infoDrag.section || from === to) return;
  const arr = infoData[section];
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  renderInfoBody();
}

window.editII = function(k, i) {
  const item = infoData[k][i];
  g('ii-' + k + '-' + i).innerHTML =
    '<input type="text" value="' + esc(item.label) + '" id="el-' + k + '-' + i + '" style="flex:0 0 100px;margin-right:5px"/>' +
    '<input type="text" value="' + esc(item.val) + '" id="ev-' + k + '-' + i + '" style="flex:1"/>' +
    '<button class="ieb" onclick="saveII(\'' + k + '\',' + i + ')">✅</button>' +
    '<button class="ieb" onclick="delII(\'' + k + '\',' + i + ')">🗑</button>';
};
window.saveII = function(k, i) {
  infoData[k][i].label = g('el-' + k + '-' + i).value;
  infoData[k][i].val   = g('ev-' + k + '-' + i).value;
  renderInfoBody();
};
window.delII = function(k, i) { infoData[k].splice(i, 1); renderInfoBody(); };
window.addII = function(k) {
  infoData[k].push({label:'새 항목', val:''});
  renderInfoBody();
  editII(k, infoData[k].length - 1);
};

// ── 유틸 ─────────────────────────────────────────────────────
function g(id)    { return document.getElementById(id); }
function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }
function p2(n)    { return String(n).padStart(2, '0'); }
function td()     { return new Date().toISOString().slice(0, 10); }
function esc(s)   {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function toast(msg, type) {
  const el = g('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTask();
    closeInfo();
    closeDp();
  }
});
</script>
