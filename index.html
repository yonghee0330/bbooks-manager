<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비북스 매니저 대시보드</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: rgba(0,0,0,0.10);
      --border-strong: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-muted: #6b6b66;
      --accent: #2d5a3d;
      --accent-light: #e8f0ea;
      --accent-hover: #234830;
      --danger: #c0392b;
      --warning: #d68910;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* ─── Header ─── */
    header {
      background: var(--accent);
      color: white;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .header-right { display: flex; gap: 12px; align-items: center; }
    .sync-status { font-size: 12px; opacity: 0.75; }
    #syncBtn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #syncBtn:hover { background: rgba(255,255,255,0.28); }

    /* ─── API Setup Banner ─── */
    #setupBanner {
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
      padding: 10px 24px;
      font-size: 13px;
      color: #5d4037;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #setupBanner.hidden { display: none; }
    #setupBanner input {
      flex: 1;
      max-width: 480px;
      padding: 6px 10px;
      border: 1px solid #ffe082;
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }
    #setupBanner button {
      padding: 6px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ─── Tabs ─── */
    .tab-bar {
      display: flex;
      gap: 0;
      padding: 16px 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 8px 18px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .tab.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
    .tab:hover:not(.active) { color: var(--text); }

    /* ─── Main layout ─── */
    .main { display: flex; gap: 0; min-height: calc(100vh - 112px); }

    /* ─── Filter bar ─── */
    .filter-bar {
      padding: 14px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .filter-bar select, .filter-bar input {
      padding: 6px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 13px;
      background: white;
      color: var(--text);
    }
    .filter-label { font-size: 12px; color: var(--text-muted); }

    /* ─── Task list ─── */
    .task-area { flex: 1; padding: 20px 24px; min-width: 0; }
    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
      position: relative;
    }
    .task-card:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
    .task-card.done { opacity: 0.55; }

    .task-priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .prio-urgent { background: #e74c3c; }
    .prio-important { background: #f39c12; }
    .prio-normal { background: #27ae60; }

    .task-content { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
    }
    .badge.assignee-jose { background: #e8f4fd; color: #1a5276; }
    .badge.assignee-sudden { background: #fef9e7; color: #7d6608; }
    .badge.assignee-both { background: #e9f7ef; color: #1e8449; }
    .badge.status-진행중 { background: #eaf4fb; color: #1a5276; }
    .badge.status-완료 { background: #e9f7ef; color: #1e8449; }
    .badge.status-보류 { background: #fdedec; color: #922b21; }

    .task-date { font-size: 12px; color: var(--text-muted); margin-left: auto; flex-shrink: 0; }
    .task-date.overdue { color: var(--danger); font-weight: 600; }

    /* ─── Add task button ─── */
    .add-task-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--accent-light);
      border: 1.5px dashed var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .add-task-btn:hover { background: #dceee0; }

    /* ─── Info sidebar ─── */
    .info-sidebar {
      width: 280px;
      border-left: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      flex-shrink: 0;
    }
    .info-sidebar h3 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    #infoContent {
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: var(--text);
      min-height: 80px;
    }
    #editInfoBtn {
      margin-top: 12px;
      padding: 6px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      width: 100%;
    }
    #editInfoBtn:hover { background: var(--surface2); }

    /* ─── Stats bar ─── */
    .stats-bar {
      display: flex;
      gap: 12px;
      padding: 0 24px 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      min-width: 100px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }

    /* ─── Modal ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      font-size: 14px;
      background: white;
      color: var(--text);
      font-family: inherit;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn { padding: 8px 18px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: background 0.15s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border-strong); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #a93226; }

    /* ─── Loading ─── */
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1a18;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--accent); }
    #toast.error { background: var(--danger); }

    @media (max-width: 700px) {
      .info-sidebar { display: none; }
      .stats-bar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <h1>🟢 BBOOKS MANAGER</h1>
  <div class="header-right">
    <span class="sync-status" id="syncStatus">구글 시트 미연결</span>
    <button id="syncBtn" onclick="loadAll()">↻ 새로고침</button>
  </div>
</header>

<!-- API URL 설정 배너 -->
<div id="setupBanner">
  <span>⚠️ Google Apps Script 웹앱 URL을 입력하면 구글 시트와 연동됩니다.</span>
  <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/AKf.../exec" />
  <button onclick="saveApiUrl()">연결</button>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="setTab('all', this)">전체</div>
  <div class="tab" onclick="setTab('호세', this)">호세</div>
  <div class="tab" onclick="setTab('써든리', this)">써든리</div>
  <div class="tab" onclick="setTab('공동', this)">공동</div>
</div>

<!-- 통계 -->
<div class="stats-bar" id="statsBar" style="padding-top:16px;">
  <div class="stat-card"><div class="stat-label">전체 업무</div><div class="stat-value" id="statTotal">-</div></div>
  <div class="stat-card"><div class="stat-label">진행중</div><div class="stat-value" id="statInProgress">-</div></div>
  <div class="stat-card"><div class="stat-label">완료</div><div class="stat-value" id="statDone">-</div></div>
  <div class="stat-card"><div class="stat-label">⚠ 기한초과</div><div class="stat-value" id="statOverdue" style="color:var(--danger)">-</div></div>
</div>

<div class="filter-bar">
  <span class="filter-label">필터:</span>
  <select id="filterStatus" onchange="renderTasks()">
    <option value="">전체 상태</option>
    <option>예정</option>
    <option>진행중</option>
    <option>완료</option>
    <option>보류</option>
  </select>
  <select id="filterPriority" onchange="renderTasks()">
    <option value="">전체 중요도</option>
    <option value="🔴 긴급">🔴 긴급</option>
    <option value="🟡 중요">🟡 중요</option>
    <option value="🟢 일반">🟢 일반</option>
  </select>
  <select id="sortBy" onchange="renderTasks()">
    <option value="created">최신순</option>
    <option value="due">마감일순</option>
    <option value="priority">중요도순</option>
  </select>
  <input type="text" id="searchInput" placeholder="검색..." oninput="renderTasks()" style="margin-left:auto;" />
</div>

<div class="main">
  <div class="task-area">
    <div id="taskList" class="task-list">
      <div class="loading"><div class="spinner"></div><br>불러오는 중...</div>
    </div>
    <button class="add-task-btn" onclick="openTaskModal()" style="margin-top:12px;">
      + 업무 추가
    </button>
  </div>

  <aside class="info-sidebar">
    <h3>📋 비북스 중요 정보</h3>
    <div id="infoContent">로딩중...</div>
    <button id="editInfoBtn" onclick="openInfoModal()">✏️ 수정하기</button>
  </aside>
</div>

<!-- 업무 추가/수정 모달 -->
<div class="modal-overlay hidden" id="taskModal">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">업무 추가</span>
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
    </div>
    <input type="hidden" id="taskId" />
    <div class="form-group">
      <label>제목 *</label>
      <input type="text" id="taskTitle" placeholder="업무 내용을 입력하세요" />
    </div>
    <div class="form-group">
      <label>카테고리</label>
      <input type="text" id="taskCategory" placeholder="예: 촬영, 편집, 기획..." />
    </div>
    <div class="form-group">
      <label>담당자</label>
      <select id="taskAssignee">
        <option value="호세">호세</option>
        <option value="써든리">써든리</option>
        <option value="공동">공동</option>
      </select>
    </div>
    <div class="form-group">
      <label>중요도</label>
      <select id="taskPriority">
        <option value="🔴 긴급">🔴 긴급</option>
        <option value="🟡 중요">🟡 중요</option>
        <option value="🟢 일반">🟢 일반</option>
      </select>
    </div>
    <div class="form-group">
      <label>예상 소요시간</label>
      <input type="text" id="taskHours" placeholder="예: 2시간" />
    </div>
    <div class="form-group">
      <label>진행상태</label>
      <select id="taskStatus">
        <option>예정</option>
        <option>진행중</option>
        <option>완료</option>
        <option>보류</option>
      </select>
    </div>
    <div class="form-group">
      <label>예상완료일</label>
      <input type="date" id="taskDueDate" />
    </div>
    <div class="form-group">
      <label>진행 메모</label>
      <textarea id="taskMemo" placeholder="진행상황, 참고사항 등"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteCurrentTask()" style="margin-right:auto;display:none;">삭제</button>
      <button class="btn btn-secondary" onclick="closeTaskModal()">취소</button>
      <button class="btn btn-primary" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- 중요정보 수정 모달 -->
<div class="modal-overlay hidden" id="infoModal">
  <div class="modal">
    <div class="modal-title">
      <span>비북스 중요 정보 수정</span>
      <button class="modal-close" onclick="closeInfoModal()">✕</button>
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea id="infoText" style="min-height:200px;" placeholder="채널 정보, 연락처, 중요 링크 등 공유할 내용을 자유롭게 입력하세요."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeInfoModal()">취소</button>
      <button class="btn btn-primary" onclick="saveInfo()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── 상태 ──────────────────────────────────────────────────────
let tasks = [];
let currentTab = 'all';
let currentEditId = null;
let API_URL = localStorage.getItem('bbooksApiUrl') || '';

// ── 초기화 ────────────────────────────────────────────────────
window.onload = () => {
  if (API_URL) {
    document.getElementById('setupBanner').classList.add('hidden');
    document.getElementById('apiUrlInput').value = API_URL;
    document.getElementById('syncStatus').textContent = '구글 시트 연결됨';
    loadAll();
  } else {
    document.getElementById('apiUrlInput').value = '';
    renderTasks(); // 빈 상태
  }
};

function saveApiUrl() {
  const url = document.getElementById('apiUrlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    showToast('올바른 Apps Script URL을 입력하세요.', 'error');
    return;
  }
  API_URL = url;
  localStorage.setItem('bbooksApiUrl', url);
  document.getElementById('setupBanner').classList.add('hidden');
  document.getElementById('syncStatus').textContent = '구글 시트 연결됨';
  loadAll();
}

// ── API 호출 ──────────────────────────────────────────────────
async function apiFetch(action, method = 'GET', body = null) {
  if (!API_URL) return null;
  const url = `${API_URL}?action=${action}`;
  const opts = { method };
  if (body) {
    opts.method = 'POST';
    opts.body = JSON.stringify(body);
    opts.headers = { 'Content-Type': 'text/plain' }; // CORS 우회
  }
  const res = await fetch(url, opts);
  return res.json();
}

async function loadAll() {
  document.getElementById('taskList').innerHTML = '<div class="loading"><div class="spinner"></div><br>불러오는 중...</div>';
  try {
    const [taskData, infoData] = await Promise.all([
      apiFetch('getTasks'),
      apiFetch('getInfo')
    ]);
    if (taskData && taskData.tasks) {
      tasks = taskData.tasks;
    }
    if (infoData) {
      document.getElementById('infoContent').textContent = infoData.content || '(내용 없음)';
    }
    renderTasks();
    updateStats();
    showToast('업데이트됨', 'success');
  } catch (e) {
    showToast('불러오기 실패: ' + e.message, 'error');
    renderTasks();
  }
}

// ── 탭 ───────────────────────────────────────────────────────
function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ── 렌더링 ────────────────────────────────────────────────────
function renderTasks() {
  const status = document.getElementById('filterStatus')?.value || '';
  const priority = document.getElementById('filterPriority')?.value || '';
  const sort = document.getElementById('sortBy')?.value || 'created';
  const search = document.getElementById('searchInput')?.value.toLowerCase() || '';

  let filtered = tasks.filter(t => {
    if (currentTab !== 'all' && t.assignee !== currentTab) return false;
    if (status && t.status !== status) return false;
    if (priority && t.priority !== priority) return false;
    if (search && !t.title.toLowerCase().includes(search) && !t.category.toLowerCase().includes(search)) return false;
    return true;
  });

  const prioOrder = { '🔴 긴급': 0, '🟡 중요': 1, '🟢 일반': 2 };
  filtered.sort((a, b) => {
    if (sort === 'priority') return (prioOrder[a.priority] || 2) - (prioOrder[b.priority] || 2);
    if (sort === 'due') return (a.due_date || 'z').localeCompare(b.due_date || 'z');
    return b.created_at.localeCompare(a.created_at);
  });

  const container = document.getElementById('taskList');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div>업무가 없습니다.<br><small>아래 버튼으로 업무를 추가하세요.</small></div>`;
    return;
  }

  container.innerHTML = filtered.map(t => {
    const dotClass = t.priority === '🔴 긴급' ? 'prio-urgent' : t.priority === '🟡 중요' ? 'prio-important' : 'prio-normal';
    const assigneeClass = t.assignee === '호세' ? 'assignee-jose' : t.assignee === '써든리' ? 'assignee-sudden' : 'assignee-both';
    const statusClass = `status-${t.status}`;
    const isDone = t.status === '완료';

    const today = new Date().toISOString().slice(0, 10);
    const isOverdue = t.due_date && t.due_date < today && t.status !== '완료';
    const dateStr = t.due_date ? `${t.due_date}${isOverdue ? ' ⚠' : ''}` : '';

    return `
      <div class="task-card ${isDone ? 'done' : ''}" onclick="openTaskModal('${t.id}')">
        <div class="task-priority-dot ${dotClass}"></div>
        <div class="task-content">
          <div class="task-title">${escHtml(t.title)}</div>
          <div class="task-meta">
            ${t.category ? `<span class="badge">${escHtml(t.category)}</span>` : ''}
            <span class="badge ${assigneeClass}">${escHtml(t.assignee)}</span>
            <span class="badge ${statusClass}">${escHtml(t.status)}</span>
            ${t.estimated_hours ? `<span class="badge">⏱ ${escHtml(t.estimated_hours)}</span>` : ''}
          </div>
          ${t.memo ? `<div style="font-size:12px;color:var(--text-muted);margin-top:5px;">${escHtml(t.memo).slice(0, 60)}${t.memo.length > 60 ? '…' : ''}</div>` : ''}
        </div>
        <div class="task-date ${isOverdue ? 'overdue' : ''}">${dateStr}</div>
      </div>`;
  }).join('');
}

function updateStats() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('statTotal').textContent = tasks.length;
  document.getElementById('statInProgress').textContent = tasks.filter(t => t.status === '진행중').length;
  document.getElementById('statDone').textContent = tasks.filter(t => t.status === '완료').length;
  document.getElementById('statOverdue').textContent = tasks.filter(t => t.due_date && t.due_date < today && t.status !== '완료').length;
}

// ── 업무 모달 ─────────────────────────────────────────────────
function openTaskModal(id = null) {
  currentEditId = id;
  const modal = document.getElementById('taskModal');
  modal.classList.remove('hidden');

  if (id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    document.getElementById('modalTitle').textContent = '업무 수정';
    document.getElementById('taskId').value = t.id;
    document.getElementById('taskTitle').value = t.title;
    document.getElementById('taskCategory').value = t.category;
    document.getElementById('taskAssignee').value = t.assignee;
    document.getElementById('taskPriority').value = t.priority;
    document.getElementById('taskHours').value = t.estimated_hours;
    document.getElementById('taskStatus').value = t.status;
    document.getElementById('taskDueDate').value = t.due_date;
    document.getElementById('taskMemo').value = t.memo;
    document.getElementById('deleteBtn').style.display = 'block';
  } else {
    document.getElementById('modalTitle').textContent = '업무 추가';
    document.getElementById('taskId').value = '';
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskCategory').value = '';
    document.getElementById('taskAssignee').value = '호세';
    document.getElementById('taskPriority').value = '🟢 일반';
    document.getElementById('taskHours').value = '';
    document.getElementById('taskStatus').value = '예정';
    document.getElementById('taskDueDate').value = '';
    document.getElementById('taskMemo').value = '';
    document.getElementById('deleteBtn').style.display = 'none';
  }
}

function closeTaskModal() {
  document.getElementById('taskModal').classList.add('hidden');
  currentEditId = null;
}

async function saveTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { showToast('제목을 입력하세요.', 'error'); return; }

  const task = {
    id: document.getElementById('taskId').value,
    title,
    category: document.getElementById('taskCategory').value,
    assignee: document.getElementById('taskAssignee').value,
    priority: document.getElementById('taskPriority').value,
    estimated_hours: document.getElementById('taskHours').value,
    status: document.getElementById('taskStatus').value,
    due_date: document.getElementById('taskDueDate').value,
    memo: document.getElementById('taskMemo').value,
  };

  closeTaskModal();

  if (!API_URL) {
    // 로컬 전용 모드
    if (task.id) {
      const idx = tasks.findIndex(t => t.id === task.id);
      if (idx !== -1) tasks[idx] = { ...tasks[idx], ...task };
    } else {
      task.id = 'local_' + Date.now();
      task.created_at = new Date().toISOString();
      tasks.push(task);
    }
    renderTasks();
    updateStats();
    showToast('저장됨 (로컬 전용 — 구글 시트 미연결)', 'success');
    return;
  }

  try {
    if (task.id) {
      await apiFetch('updateTask', 'POST', task);
    } else {
      await apiFetch('addTask', 'POST', task);
    }
    await loadAll();
    showToast('저장 완료!', 'success');
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
}

async function deleteCurrentTask() {
  if (!confirm('이 업무를 삭제할까요?')) return;
  const id = document.getElementById('taskId').value;
  closeTaskModal();

  if (!API_URL) {
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
    updateStats();
    showToast('삭제됨', 'success');
    return;
  }

  try {
    await apiFetch(`deleteTask&id=${id}`);
    await loadAll();
    showToast('삭제 완료', 'success');
  } catch (e) {
    showToast('삭제 실패: ' + e.message, 'error');
  }
}

// ── 중요 정보 모달 ────────────────────────────────────────────
function openInfoModal() {
  document.getElementById('infoText').value = document.getElementById('infoContent').textContent;
  document.getElementById('infoModal').classList.remove('hidden');
}
function closeInfoModal() {
  document.getElementById('infoModal').classList.add('hidden');
}

async function saveInfo() {
  const content = document.getElementById('infoText').value;
  document.getElementById('infoContent').textContent = content || '(내용 없음)';
  closeInfoModal();

  if (!API_URL) {
    localStorage.setItem('bbooksInfo', content);
    showToast('저장됨 (로컬 전용)', 'success');
    return;
  }

  try {
    await apiFetch('saveInfo', 'POST', { content });
    showToast('저장 완료!', 'success');
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
}

// ── 유틸 ─────────────────────────────────────────────────────
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => { el.className = ''; }, 2800);
}

// ESC로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTaskModal();
    closeInfoModal();
  }
});
</script>
</body>
</html>
