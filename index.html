<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비북스 매니저</title>
<style>
/* ── 변수 ── */
:root {
  --navy: #0A1F44;
  --navy2: #152d5e;
  --navy3: #1e3f7a;
  --green: #1A6B3C;
  --bg: #f2f3f7;
  --card: #ffffff;
  --border: #e2e4ea;
  --text: #1a1e2e;
  --sub: #5a6075;
  --r: 10px;
  --sh: 0 2px 12px rgba(10,31,68,.09);
  --cat1: #8B6914; /* 공간 */
  --cat2: #1A6B3C; /* 홍보 */
  --cat3: #1A4F8B; /* 점주 */
  --cat4: #7B2D8B; /* 행사 */
  --cat5: #8B2020; /* 운영 */
  --cat6: #2B7B8B; /* 외부 */
  --cat7: #6B5B2B; /* 기획 */
  --p0: #dc2626;
  --p1: #d97706;
  --p2: #16a34a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── 헤더 ── */
#hdr {
  background: var(--navy);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 500;
  gap: 8px;
}
#hdr h1 { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .3px; white-space: nowrap; }
.hdr-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.btn-hdr {
  padding: 5px 11px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.btn-ghost { background: rgba(255,255,255,.13); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.btn-ghost:hover { background: rgba(255,255,255,.22); }
.btn-green { background: #e8f5ed; color: var(--green); }
.btn-green:hover { background: #d4eddb; }
.sync-wrap { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,.65); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; transition: background .3s; }
.dot.on { background: #4ade80; }

/* API 배너 제거 — Firebase 사용 */

/* ── 담당자 탭 ── */
#abar {
  background: var(--navy2);
  display: flex;
  gap: 4px;
  padding: 5px 16px;
}
.af {
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.65);
  background: transparent;
  transition: all .15s;
}
.af.on { background: #fff; color: var(--navy); border-color: #fff; }

/* ── 카테고리 탭 ── */
#catbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 16px;
}
#catbar::-webkit-scrollbar { height: 0; }
.ct {
  padding: 9px 13px;
  border-bottom: 2.5px solid transparent;
  cursor: pointer;
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}
.ct.on { border-bottom-color: var(--navy); color: var(--navy); font-weight: 700; }
.ct:hover:not(.on) { color: var(--text); }

/* ── 뷰 바 ── */
#vbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 16px;
  flex-wrap: wrap;
}
.vb {
  padding: 3px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--sub);
  transition: all .15s;
}
.vb.on { background: var(--navy); color: #fff; border-color: var(--navy); }
#vbar select {
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
  color: var(--text);
}
.ml { margin-left: auto; }
#searchInput {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  width: 140px;
}

/* ── 통계 ── */
#stats {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  min-width: 75px;
}
.stat-l { font-size: 10px; color: var(--sub); margin-bottom: 2px; }
.stat-v { font-size: 20px; font-weight: 800; color: var(--navy); }
.stat-v.red { color: var(--p0); }

/* ── AI 메모장 ── */
.memo-wrap { padding: 14px 16px 24px; }
.memo-compose {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: var(--sh);
}
.memo-compose textarea {
  width: 100%;
  min-height: 72px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  resize: vertical;
  line-height: 1.5;
}
.memo-compose textarea:focus { outline: none; border-color: var(--navy); }
.memo-compose-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.memo-compose-bar select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
}
.memo-compose-bar .memo-hint {
  font-size: 11px;
  color: var(--sub);
  margin-left: auto;
}
.btn-memo {
  padding: 7px 14px;
  border: none;
  border-radius: 7px;
  background: linear-gradient(135deg, #1e3f7a, var(--navy));
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.btn-memo:hover { opacity: .92; }
.memo-board {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  align-items: start;
}
.memo-col {
  background: #f8f9fc;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
}
.memo-col-h {
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  border-radius: 11px 11px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.memo-col-count {
  background: rgba(255,255,255,.22);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
}
.memo-col-list {
  flex: 1;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 120px;
}
.memo-col-list.memo-over {
  background: rgba(10,31,68,.06);
  outline: 2px dashed var(--navy3);
  outline-offset: -4px;
  border-radius: 0 0 10px 10px;
}
.memo-note {
  position: relative;
  padding: 10px 10px 8px 28px;
  border-radius: 8px;
  border: 2px solid;
  box-shadow: 0 4px 14px rgba(10,31,68,.12);
  cursor: default;
  transition: transform .12s, box-shadow .12s;
}
.memo-note:hover { box-shadow: 0 6px 18px rgba(10,31,68,.16); }
.memo-note.memo-dragging { opacity: .55; transform: rotate(-1deg); }
.memo-note.author-hosea {
  background: linear-gradient(160deg, #dbeafe 0%, #eff6ff 100%);
  border-color: #3b82f6;
}
.memo-note.author-sundari {
  background: linear-gradient(160deg, #fce7f3 0%, #fdf2f8 100%);
  border-color: #ec4899;
}
.memo-grip {
  position: absolute;
  left: 6px;
  top: 8px;
  color: rgba(10,31,68,.35);
  font-size: 13px;
  cursor: grab;
  user-select: none;
  padding: 2px;
}
.memo-grip:active { cursor: grabbing; }
.memo-note-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
}
.memo-author-badge {
  font-size: 10px;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 10px;
  color: #fff;
}
.author-hosea .memo-author-badge { background: #2563eb; }
.author-sundari .memo-author-badge { background: #db2777; }
.memo-note-del {
  border: none;
  background: transparent;
  color: rgba(10,31,68,.35);
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}
.memo-note-del:hover { color: #dc2626; }
.memo-note-text {
  font-size: 12px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 8px;
}
.memo-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.memo-tag {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 8px;
  background: rgba(10,31,68,.08);
  color: var(--navy);
}
.memo-ai-badge {
  font-size: 9px;
  color: var(--sub);
  margin-top: 6px;
}

/* ── 화이트보드 ── */
.wb-wrap { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; height: calc(100vh - 168px); min-height: 480px; }
.wb-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  box-shadow: var(--sh);
}
.wb-tool {
  padding: 6px 11px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
}
.wb-tool.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.wb-tool-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
.wb-toolbar select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-weight: 700; }
.wb-toolbar .wb-hint { font-size: 10px; color: var(--sub); margin-left: auto; }
.wb-viewport {
  flex: 1;
  overflow: auto;
  background: #e8eaef;
  border: 1px solid var(--border);
  border-radius: 12px;
  position: relative;
}
.wb-surface {
  position: relative;
  width: 2400px;
  height: 1600px;
  background:
    linear-gradient(#f4f5f8 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, #f4f5f8 1px, transparent 1px) 0 0 / 24px 24px,
    #fff;
  box-shadow: inset 0 0 0 1px #dde1e8;
}
#wbCanvas {
  position: absolute;
  inset: 0;
  width: 2400px;
  height: 1600px;
  touch-action: none;
  cursor: crosshair;
}
.wb-objects { position: absolute; inset: 0; pointer-events: none; }
.wb-item {
  position: absolute;
  pointer-events: auto;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(10,31,68,.14);
  min-width: 120px;
  max-width: 320px;
}
.wb-item.selected { outline: 2px solid var(--navy); outline-offset: 2px; }
.wb-item.author-hosea { border: 2px solid #3b82f6; }
.wb-item.author-sundari { border: 2px solid #ec4899; }
.wb-item-badge {
  position: absolute;
  top: -8px;
  left: 8px;
  font-size: 9px;
  font-weight: 900;
  color: #fff;
  padding: 1px 6px;
  border-radius: 8px;
}
.author-hosea .wb-item-badge { background: #2563eb; }
.author-sundari .wb-item-badge { background: #db2777; }
.wb-item-del {
  position: absolute;
  top: 4px;
  right: 4px;
  border: none;
  background: rgba(255,255,255,.85);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 12px;
  cursor: pointer;
  color: var(--sub);
  line-height: 1;
}
.wb-item-del:hover { color: #dc2626; }
.wb-text {
  background: #fffef5;
  padding: 12px 14px 10px;
  font-size: 13px;
  line-height: 1.45;
  min-height: 48px;
  outline: none;
  word-break: break-word;
}
.wb-link {
  background: #fff;
  padding: 12px 14px 10px;
}
.wb-link a {
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  word-break: break-all;
}
.wb-link a:hover { text-decoration: underline; }
.wb-link-url { font-size: 10px; color: var(--sub); margin-top: 4px; word-break: break-all; }
.wb-image {
  background: #fff;
  padding: 8px;
  max-width: 280px;
}
.wb-image img {
  display: block;
  width: 100%;
  border-radius: 6px;
}
.wb-image-cap {
  font-size: 10px;
  color: var(--sub);
  margin-top: 6px;
  outline: none;
  min-height: 16px;
}
.wb-viewport.tool-select #wbCanvas { cursor: default; }
.wb-viewport.tool-pen #wbCanvas { cursor: crosshair; }
.wb-viewport.tool-eraser #wbCanvas { cursor: cell; }

/* ── 로딩 ── */
#loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,31,68,.5);
  z-index: 900;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 4px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 메인 영역 ── */
#main { min-height: calc(100vh - 200px); }

/* ── 캘린더 ── */
.calw { display: flex; }
.calm { flex: 1; padding: 14px 16px; min-width: 0; overflow-x: auto; }
.cal2 { display: flex; gap: 14px; min-width: 540px; }
.cmo { flex: 1; min-width: 260px; }
.cmo-ttl { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.cgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.cdow {
  background: var(--navy);
  color: rgba(255,255,255,.8);
  text-align: center;
  padding: 5px 0;
  font-size: 10px;
  font-weight: 700;
}
.cdow:first-child { color: #fca5a5; }
.cdow:last-child  { color: #93c5fd; }
.cday {
  background: #fff;
  min-height: 80px;
  padding: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background .1s;
}
.cday:hover { background: #eef2ff; }
.cday:hover::after {
  content: '+';
  position: absolute;
  bottom: 2px; right: 4px;
  font-size: 16px;
  color: #c7cde0;
  line-height: 1;
}
.cday.om { background: #f8f9fb; opacity: .45; cursor: default; pointer-events: none; }
.cday.today { background: #eff6ff; }
.cdn {
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.cday.sun .cdn { color: #dc2626; }
.cday.sat .cdn { color: #2563eb; }
.cdn-circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff !important;
  font-size: 11px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 9px;
  line-height: 1.35;
  padding: 1px 3px;
  border-radius: 3px;
  margin-bottom: 1px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.chip:hover { opacity: .82; }
.chip-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.7); flex-shrink: 0; }
.more { font-size: 9px; color: var(--sub); padding: 1px 2px; }

/* ── 날짜 미정 패널 ── */
.ndp {
  width: 210px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--card);
  display: flex;
  flex-direction: column;
}
.ndp-h {
  padding: 10px 12px 7px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ndp-h h3 { font-size: 12px; font-weight: 700; color: var(--navy); }
.ndp-h button {
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.ndlist { flex: 1; overflow-y: auto; padding: 6px; }
.ndc {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 9px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: box-shadow .15s;
}
.ndc:hover { box-shadow: var(--sh); }
.ndc-t { font-size: 11px; font-weight: 700; margin-bottom: 3px; line-height: 1.4; }
.ndc-m { display: flex; gap: 3px; flex-wrap: wrap; }

/* ── 주간뷰 ── */
.weekw { padding: 14px 16px; }
.wgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.wcol { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.wcol-h { background: var(--navy); color: #fff; text-align: center; padding: 5px 3px; font-size: 10px; font-weight: 700; }
.wcol-h.today { background: #2563eb; }
.wcol-b { padding: 5px; min-height: 100px; }
.wchip { font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; color: #fff; cursor: pointer; line-height: 1.4; }
.wchip:hover { opacity: .82; }

/* ── 일간뷰 / 목록뷰 ── */
.listw { padding: 14px 16px; }
.listw h3 { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
.tc {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: box-shadow .15s, border-color .15s;
}
.tc:hover { box-shadow: var(--sh); border-color: #c7cde0; }
.tc.done { opacity: .45; }
.tc.done .tc-t { text-decoration: line-through; }
.tc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.tc-b { flex: 1; min-width: 0; }
.tc-t { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.tc-m { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
.b-cat { color: #fff; }
.b-who { background: #e8f0ff; color: #1a4f8b; }
.b-st  { background: #f0f4f0; color: #1a4f1a; }
.b-st.s-진행중 { background: #dbeafe; color: #1e40af; }
.b-st.s-완료   { background: #dcfce7; color: #166534; }
.b-st.s-보류   { background: #fee2e2; color: #991b1b; }
.tc-date { font-size: 11px; color: var(--sub); margin-left: auto; flex-shrink: 0; white-space: nowrap; }
.tc-date.ov { color: var(--p0); font-weight: 700; }
.tc-memo { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
.empty { text-align: center; padding: 48px; color: var(--sub); font-size: 13px; }
.empty .ei { font-size: 36px; margin-bottom: 10px; }

/* ── 날짜 패널 (사이드) ── */
#dp {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 300px;
  background: var(--card);
  box-shadow: -4px 0 24px rgba(0,0,0,.12);
  z-index: 400;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
#dp.open { transform: translateX(0); }
.dp-head {
  background: var(--navy);
  color: #fff;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

// ── 초기화 ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initFirestore();
});

async function initFirestore() {
  // 연결 상태 표시
  setConnected(false);

  // tasks 실시간 구독
  const q = query(collection(db, 'tasks'), orderBy('createdAt', 'asc'));
  unsubTasks = onSnapshot(q, snap => {
    tasks = [];
    snap.forEach(d => tasks.push({ id: d.id, ...d.data() }));
    setConnected(true);
    render();
    stats();
  }, err => {
    setConnected(false);
    toast('Firestore 연결 오류: ' + err.message, 'err');
  });

  // memos 실시간 구독
  unsubMemos = onSnapshot(collection(db, 'memos'), snap => {
    memos = [];
    snap.forEach(d => memos.push({ id: d.id, ...d.data() }));
    if (curCat === 'memo') renderMemoBoard();
  }, err => {
    toast('메모 연결 오류: ' + err.message, 'err');
  });

  unsubWhiteboard = onSnapshot(collection(db, 'whiteboard_elements'), snap => {
    wbElements = [];
    snap.forEach(d => wbElements.push({ id: d.id, ...d.data() }));
    syncWhiteboardView();
  }, err => {
    toast('화이트보드 연결 오류: ' + err.message, 'err');
  });

  // 중요 정보 로드
  await loadInfo();
}

function setConnected(on) {
  const dot = g('dot'), txt = g('conn-txt');
  dot.className = 'dot' + (on ? ' on' : '');
  txt.textContent = on ? '실시간 연결됨' : '연결 중...';
}

// ── 중요 정보 ────────────────────────────────────────────────
async function loadInfo() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'info'));
    if (snap.exists()) {
      infoData = snap.data().content;
    } else {
      infoData = clone(DEFAULT_INFO);
    }
  } catch(e) {
    infoData = clone(DEFAULT_INFO);
  }
}

// ── 필터 / 정렬 ──────────────────────────────────────────────
window.setA = function(a, el) {
  curA = a;
  qsa('.af').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
};
window.setCat = function(c, el) {
  curCat = c;
  qsa('.ct').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  toggleSpecialView(c);
  render();
};

function toggleSpecialView(mode) {
  const special = mode === 'memo' || mode === 'whiteboard';
  g('vbar').style.display = special ? 'none' : '';
  g('stats').style.display = special ? 'none' : '';
}
window.setView = function(v, el) {
  curView = v;
  qsa('.vb').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
};

function filtered() {
  const st  = g('stSel').value;
  const so  = g('sortSel').value;
  const q   = g('searchInput').value.toLowerCase();
  const today = td();

  let f = tasks.filter(t => {
    if (curA !== '전체' && t.assignee !== curA) return false;
    if (curCat !== 'all' && t.category !== curCat) return false;
    if (st && t.status !== st) return false;
    if (q && !t.title.toLowerCase().includes(q) && !(t.memo||'').toLowerCase().includes(q)) return false;
    return true;
  });

  f.sort((a, b) => {
    if (so === 'priority') return (P_ORDER[a.priority]||2) - (P_ORDER[b.priority]||2);
    if (so === 'due')      return (a.due_date||'z').localeCompare(b.due_date||'z');
    // 최신순: createdAt Timestamp 비교
    const ta = a.createdAt?.toMillis?.() ?? 0;
    const tb = b.createdAt?.toMillis?.() ?? 0;
    return tb - ta;
  });
  return f;
}

function stats() {
  const today = td();
  const f = filtered();
  g('s0').textContent = f.length;
  g('s1').textContent = f.filter(t => t.status === '진행중').length;
  g('s2').textContent = f.filter(t => t.status === '완료').length;
  g('s3').textContent = f.filter(t => t.due_date && t.due_date < today && t.status !== '완료').length;
}

// ── 렌더링 진입점 ────────────────────────────────────────────
function render() {
  if (curCat === 'memo') {
    renderMemoBoard();
    return;
  }
  if (curCat === 'whiteboard') {
    renderWhiteboard();
    return;
  }
  stats();
  if (curView === 'month')     renderMonth();
  else if (curView === 'week') renderWeek();
  else if (curView === 'day')  renderDay();
  else                         renderList(filtered());
}
window.render = render;

// ── 월간 캘린더 ──────────────────────────────────────────────
function renderMonth() {
  const now = new Date();
  const y1 = now.getFullYear(), m1 = now.getMonth();
  let m2 = m1 + 1, y2 = y1;
  if (m2 > 11) { m2 = 0; y2++; }

  const dated  = filtered().filter(t =>  t.due_date);
  const nodate = filtered().filter(t => !t.due_date);

  g('main').innerHTML =
    '<div class="calw">' +
    '<div class="calm"><div class="cal2">' +
    buildMo(y1, m1, dated) +
    buildMo(y2, m2, dated) +
    '</div></div>' +
    '<div class="ndp">' +
    '<div class="ndp-h"><h3>📌 날짜 미정 (' + nodate.length + ')</h3>' +
    '<button onclick="openTask(null,true)">+</button></div>' +
    '<div class="ndlist">' + nodate.map(ndCard).join('') + '</div>' +
    '</div></div>';
}

function buildMo(yr, mo, dated) {
  const fd  = new Date(yr, mo, 1).getDay();
  const ld  = new Date(yr, mo+1, 0).getDate();
  const pld = new Date(yr, mo, 0).getDate();
  const today = td();
  let cells = '';

  for (let i = fd-1; i >= 0; i--)
    cells += '<div class="cday om"><div class="cdn">' + (pld-i) + '</div></div>';

  for (let d = 1; d <= ld; d++) {
    const ds  = yr + '-' + p2(mo+1) + '-' + p2(d);
    const dow = new Date(yr, mo, d).getDay();
    const isT = ds === today;
    const dt  = dated.filter(t => t.due_date === ds);
    const chips = dt.slice(0, 3).map(t => {
      const bg = CAT_COLOR[t.category] || '#555';
      return '<div class="chip" style="background:' + bg + '" ' +
        'onclick="event.stopPropagation();openTask(\'' + esc(t.id) + '\')" ' +
        'title="' + esc(t.title) + '">' +
        '<span class="chip-dot"></span>' +
        esc(t.title.slice(0,12)) + (t.title.length > 12 ? '…' : '') +
        '</div>';
    }).join('');
    const more  = dt.length > 3 ? '<div class="more">+' + (dt.length-3) + '개 더</div>' : '';
    const numH  = isT ? '<span class="cdn-circle">' + d + '</span>' : d;

    cells += '<div class="cday' +
      (isT ? ' today' : '') +
      (dow===0 ? ' sun' : dow===6 ? ' sat' : '') +
      '" onclick="openDp(\'' + ds + '\')">' +
      '<div class="cdn">' + numH + '</div>' +
      chips + more + '</div>';
  }

  const total = Math.ceil((fd + ld) / 7) * 7;
  for (let x = 1; x <= total - (fd + ld); x++)
    cells += '<div class="cday om"><div class="cdn">' + x + '</div></div>';

  return '<div class="cmo"><div class="cmo-ttl">' + yr + '년 ' + MON[mo] + '</div>' +
    '<div class="cgrid">' +
    DOW.map(d => '<div class="cdow">' + d + '</div>').join('') +
    cells + '</div></div>';
}

function ndCard(t) {
  const bg = CAT_COLOR[t.category] || '#666';
  return '<div class="ndc" onclick="openTask(\'' + esc(t.id) + '\')">' +
    '<div class="ndc-t">' + esc(t.title) + '</div>' +
    '<div class="ndc-m">' +
    (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
    '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
    '<span style="font-size:10px;color:' + (P_COLOR[t.priority]||'#888') + '">' + esc(t.priority) + '</span>' +
    '</div></div>';
}

// ── 주간 뷰 ──────────────────────────────────────────────────
function renderWeek() {
  const now = new Date();
  const sw  = new Date(now); sw.setDate(now.getDate() - now.getDay());
  const days = [];
  for (let i = 0; i < 7; i++) { const dd = new Date(sw); dd.setDate(sw.getDate()+i); days.push(dd); }
  const today = td();
  const dated = filtered().filter(t => t.due_date);

  const cols = days.map(dd => {
    const ds  = dd.toISOString().slice(0,10);
    const dow = dd.getDay();
    const isT = ds === today;
    const dt  = dated.filter(t => t.due_date === ds);
    return '<div class="wcol">' +
      '<div class="wcol-h' + (isT?' today':'') + '">' +
      DOW[dow] + '<br>' + (dd.getMonth()+1) + '/' + dd.getDate() +
      '</div><div class="wcol-b">' +
      dt.map(t => {
        const bg = CAT_COLOR[t.category] || '#555';
        return '<div class="wchip" style="background:' + bg + '" onclick="openTask(\'' + esc(t.id) + '\')">' +
          esc(t.title.slice(0,16)) + (t.title.length>16?'…':'') + '</div>';
      }).join('') +
      '</div></div>';
  }).join('');

  g('main').innerHTML = '<div class="weekw"><div class="wgrid">' + cols + '</div></div>';
}

    '<span class="badge b-st s-' + t.status + '">' + esc(t.status) + '</span>' +
    (t.estimated_hours ? '<span class="badge" style="background:#f0f4f0;color:#555">⏱ ' + esc(t.estimated_hours) + '</span>' : '') +

      : '<div class="tc-date" style="color:#bbb">미정</div>') +

}

// ── 업무 모달 ─────────────────────────────────────────────────
window.openTask = function(id, noDate, prefDate) {
  noDate = !!noDate; prefDate = prefDate || '';
  editId = id || null;
  g('taskMod').classList.remove('hidden');

  if (id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    g('mod-ttl').textContent = '업무 수정';
    g('tid').value  = t.id;
    g('tT').value   = t.title || '';
    g('tC').value   = t.category || '';
    g('tA').value   = t.assignee || '호세';
    g('tP').value   = t.priority || '🟢 일반';
    g('tS').value   = t.status   || '예정';
    g('tH').value   = t.estimated_hours || '';
    g('tD').value   = t.due_date || '';
    g('tND').checked  = !t.due_date;
    g('tD').disabled  = !t.due_date;
    g('tM').value   = t.memo || '';
    g('tDel').style.display = 'block';
  } else {
    g('mod-ttl').textContent = '업무 추가';
    g('tid').value  = '';
    g('tT').value   = '';
    g('tC').value   = (curCat !== 'all') ? curCat : '';
    g('tA').value   = (curA !== '전체') ? curA : '호세';
    g('tP').value   = '🟢 일반';
    g('tS').value   = '예정';
    g('tH').value   = '';
    g('tD').value   = prefDate;
    g('tND').checked  = noDate || !prefDate;
    g('tD').disabled  = noDate || !prefDate;
    g('tM').value   = '';
    g('tDel').style.display = 'none';
  }
};
window.closeTask = function() { g('taskMod').classList.add('hidden'); editId = null; };
window.togND = function() {
  g('tD').disabled = g('tND').checked;
  if (g('tND').checked) g('tD').value = '';
};

window.saveTask = async function() {
  const title = g('tT').value.trim();
  if (!title) { toast('제목을 입력하세요', 'err'); return; }
  const nd = g('tND').checked;
  const isEdit = !!g('tid').value;

  const data = {
    title,
    category:        g('tC').value,
    assignee:        g('tA').value,
    priority:        g('tP').value,
    status:          g('tS').value,
    estimated_hours: g('tH').value,
    due_date:        nd ? '' : g('tD').value,
    memo:            g('tM').value,
    updatedAt:       serverTimestamp(),
  };

  try {
    if (isEdit) {
      await updateDoc(doc(db, 'tasks', g('tid').value), data);
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, 'tasks'), data);
    }
    closeTask();
    if (selDate) openDp(selDate);
    toast('저장됐습니다 ✓', 'ok');
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
};

window.delTask = async function() {
  if (!confirm('정말 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, 'tasks', g('tid').value));
    closeTask(); closeDp();
    toast('삭제됐습니다', 'ok');

    toast('삭제 실패: ' + e.message, 'err');
  }
};

// ── AI 메모장 ──────────────────────────────────────────────────
function classifyMemo(text) {
  const t = text.toLowerCase();
  let best = { cat: '💡 기획&아이디어', score: 0 };

  CLASSIFY_RULES.forEach(rule => {
    let score = 0;
    rule.kw.forEach(kw => { if (t.includes(kw)) score++; });
    if (score > best.score) best = { cat: rule.cat, score };
  });

  const tags = [];
  (text.match(/#[\w가-힣]+/g) || []).forEach(tag => tags.push(tag.slice(1)));
  const matched = CLASSIFY_RULES.find(r => r.cat === best.cat);
  if (matched) {
    matched.kw.forEach(kw => {
      if (t.includes(kw) && !tags.includes(kw)) tags.push(kw);
    });
  }
  if (best.score === 0) tags.push('미분류');

  return { category: best.cat, tags: tags.slice(0, 6) };
}

function detectMemoAuthor(text, fallback) {
  if (/써든리|sundari/i.test(text)) return '써든리';
  if (/호세|hosea/i.test(text)) return '호세';
  if (fallback === '호세' || fallback === '써든리') return fallback;
  return '호세';
}

function filteredMemos() {
  return memos
    .filter(m => curA === '전체' || m.author === curA)
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

function nextMemoOrder(cat) {
  const inCat = memos.filter(m => m.category === cat);
  if (!inCat.length) return Date.now();
  return Math.max(...inCat.map(m => m.order || 0)) + 1;
}

function renderMemoBoard() {
  const defaultAuthor = (curA === '호세' || curA === '써든리') ? curA : '호세';
  const list = filteredMemos();

  g('main').innerHTML =
    '<div class="memo-wrap">' +
    '<div class="memo-compose">' +
    '<textarea id="memoInput" placeholder="진행 중인 생각, 아이디어, 할 일… 무엇이든 적어주세요. AI가 카테고리와 태그를 자동 분류합니다."></textarea>' +
    '<div class="memo-compose-bar">' +
    '<select id="memoAuthor"><option' + (defaultAuthor==='호세'?' selected':'') + '>호세</option><option' + (defaultAuthor==='써든리'?' selected':'') + '>써든리</option></select>' +
    '<button class="btn-memo" onclick="addMemo()">✨ AI 분류 & 포스트잇 붙이기</button>' +
    '<span class="memo-hint">⠿ 드래그로 카테고리·순서 변경</span>' +
    '</div></div>' +
    '<div class="memo-board">' +
    MEMO_CATS.map(cat => {
      const items = list.filter(m => m.category === cat);
      const colColor = CAT_COLOR[cat] || varNavy();
      return '<div class="memo-col">' +
        '<div class="memo-col-h" style="background:' + colColor + '">' +
        '<span>' + esc(cat) + '</span>' +
        '<span class="memo-col-count">' + items.length + '</span></div>' +
        '<div class="memo-col-list" data-cat="' + escAttr(cat) + '">' +
        items.map(m => memoNoteHtml(m)).join('') +
        '</div></div>';
    }).join('') +
    '</div></div>';

  initMemoDragDrop();
}

function varNavy() { return '#0A1F44'; }

function memoNoteHtml(m) {
  const authorCls = m.author === '써든리' ? 'author-sundari' : 'author-hosea';
  const tags = (m.tags || []).map(t => '<span class="memo-tag">#' + esc(t) + '</span>').join('');
  return '<div class="memo-note ' + authorCls + '" data-id="' + m.id + '" data-cat="' + escAttr(m.category) + '">' +
    '<span class="memo-grip" draggable="true" title="드래그하여 이동">⠿</span>' +
    '<div class="memo-note-top">' +
    '<span class="memo-author-badge">' + esc(m.author) + '</span>' +
    '<button class="memo-note-del" type="button" onclick="deleteMemo(\'' + m.id + '\')">×</button>' +
    '</div>' +
    '<div class="memo-note-text" ondblclick="editMemo(\'' + m.id + '\')">' + esc(m.text) + '</div>' +
    '<div class="memo-tags">' + tags + '</div>' +
    '<div class="memo-ai-badge">🤖 AI 분류</div>' +
    '</div>';
}

function escAttr(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function saveMemoFromText(text, author, source) {
  const trimmed = text.trim();
  if (!trimmed) throw new Error('내용이 비어 있습니다');
  const resolvedAuthor = detectMemoAuthor(trimmed, author);
  const { category, tags } = classifyMemo(trimmed);
  await addDoc(collection(db, 'memos'), {
    text: trimmed,
    author: resolvedAuthor,
    category,
    tags,
    order: nextMemoOrder(category),
    source: source || 'manual',
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
  return { category, resolvedAuthor };
}

window.addMemo = async function() {
  const text = g('memoInput').value.trim();
  if (!text) { toast('메모 내용을 입력해주세요', 'err'); return; }
  try {
    const { category } = await saveMemoFromText(text, g('memoAuthor').value, 'manual');
    g('memoInput').value = '';
    toast('🤖 ' + category.split(' ')[0] + ' 카테고리로 분류됐습니다', 'ok');
  } catch(e) {
    toast('메모 저장 실패: ' + e.message, 'err');
  }
};

window.editMemo = async function(id) {
  const m = memos.find(x => x.id === id);
  if (!m) return;

function initMemoDragDrop() {
  qsa('.memo-grip').forEach(grip => {
    grip.addEventListener('dragstart', onMemoDragStart);
    grip.addEventListener('dragend', onMemoDragEnd);
  });
  qsa('.memo-col-list').forEach(list => {
    list.addEventListener('dragenter', onMemoListDragEnter);
    list.addEventListener('dragover', onMemoListDragOver);
    list.addEventListener('dragleave', onMemoListDragLeave);
    list.addEventListener('drop', onMemoListDrop);
  });
}

function onMemoDragStart(e) {
  const note = e.target.closest('.memo-note');
  if (!note) return;
  memoDrag = {
    id: note.dataset.id,
    fromCat: note.dataset.cat,
    fromEl: note
  };
  note.classList.add('memo-dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', memoDrag.id);
  if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(note, 20, 20);
}

function onMemoDragEnd() {
  qsa('.memo-note').forEach(n => n.classList.remove('memo-dragging'));
  qsa('.memo-col-list').forEach(l => l.classList.remove('memo-over'));
  memoDrag = null;
}

function onMemoListDragEnter(e) {
  if (!memoDrag) return;
  e.preventDefault();
}

function onMemoListDragOver(e) {
  if (!memoDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  qsa('.memo-col-list').forEach(l => l.classList.remove('memo-over'));
  e.currentTarget.classList.add('memo-over');
}

function onMemoListDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('memo-over');
  }
}

async function onMemoListDrop(e) {
  e.preventDefault();
  if (!memoDrag) return;

  const list = e.currentTarget;
  const toCat = list.dataset.cat;
  const note = e.target.closest('.memo-note');
  const notes = Array.from(list.querySelectorAll('.memo-note')).filter(n => n.dataset.id !== memoDrag.id);

  let toIndex = notes.length;
  if (note && note.dataset.id !== memoDrag.id) {
    toIndex = notes.indexOf(note);
    const rect = note.getBoundingClientRect();
    if (e.clientY > rect.top + rect.height / 2) toIndex += 1;
  }

  const m = memos.find(x => x.id === memoDrag.id);
  if (!m) return;

  const sameCat = m.category === toCat;
  const catMemos = memos
    .filter(x => x.category === toCat && x.id !== memoDrag.id)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  catMemos.splice(toIndex, 0, { ...m, category: toCat });

  try {
    const batch = catMemos.map((item, i) =>
      updateDoc(doc(db, 'memos', item.id), {
        category: toCat,
        order: (i + 1) * 1000,
        updatedAt: serverTimestamp()
      })
    );
    if (!sameCat || m.category !== toCat) {
      await Promise.all(batch);
      toast('📌 ' + toCat.split(' ')[0] + '로 이동됐습니다', 'ok');
    } else {
      await Promise.all(batch);
    }
  } catch(err) {
    toast('이동 실패: ' + err.message, 'err');
  }

  qsa('.memo-col-list').forEach(l => l.classList.remove('memo-over'));
  memoDrag = null;
}

function syncWhiteboardView() {
  if (curCat !== 'whiteboard' || !g('wbCanvas')) return;
  redrawWhiteboardStrokes();
  renderWhiteboardObjects();
}

function initWhiteboardEvents() {
  const canvas = g('wbCanvas');
  const surface = g('wbSurface');
  if (!canvas || !surface) return;

  canvas.onpointerdown = onWbCanvasDown;
  canvas.onpointermove = onWbCanvasMove;
  canvas.onpointerup = onWbCanvasUp;
  canvas.onpointerleave = onWbCanvasUp;
  surface.onclick = onWbSurfaceClick;
}

function setWbViewportToolClass() {
  const vp = g('wbViewport');
  if (!vp) return;
  vp.className = 'wb-viewport tool-' + wbTool;
}

window.setWbTool = function(tool, el) {
  wbTool = tool;
  qsa('.wb-tool[data-wb-tool]').forEach(b => b.classList.remove('on'));
  if (el) el.classList.add('on');
  setWbViewportToolClass();
};

function wbPos(e) {
  const rect = g('wbCanvas').getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(WB_W, e.clientX - rect.left)),
    y: Math.max(0, Math.min(WB_H, e.clientY - rect.top))
  };
}

function onWbCanvasDown(e) {
  if (wbTool === 'text') {
    const p = wbPos(e);
    createWbText(p.x, p.y);
    return;
  }
  if (wbTool === 'select') {
    wbSelectedId = null;
    renderWhiteboardObjects();
    return;
  }
  if (wbTool !== 'pen' && wbTool !== 'eraser') return;
  e.preventDefault();
  wbDrawing = true;
  wbCurrentPoints = [wbPos(e)];
  e.target.setPointerCapture(e.pointerId);
}

function onWbCanvasMove(e) {
  if (!wbDrawing) return;
  const p = wbPos(e);
  const ctx = g('wbCanvas').getContext('2d');
  const color = WB_AUTHOR_COLOR[getWbAuthor()];
  const pts = wbCurrentPoints;
  if (pts.length) {
    ctx.strokeStyle = wbTool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = wbTool === 'eraser' ? 18 : 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  pts.push(p);
}

async function onWbCanvasUp(e) {
  if (!wbDrawing) return;
  wbDrawing = false;
  try { e.target.releasePointerCapture(e.pointerId); } catch(_) {}

  if (wbTool === 'pen' && wbCurrentPoints.length > 1) {
    const author = getWbAuthor();
    const points = simplifyPoints(wbCurrentPoints);
    try {
      const docRef = await addDoc(collection(db, 'whiteboard_elements'), {
        type: 'stroke',
        points,
        color: WB_AUTHOR_COLOR[author],
        width: 3,
        author,
        createdAt: serverTimestamp()
      });
      wbLocalStrokeId = docRef.id;
    } catch(err) {
      toast('그리기 저장 실패: ' + err.message, 'err');
      redrawWhiteboardStrokes();
    }
  } else if (wbTool === 'eraser' && wbCurrentPoints.length) {
    const hit = findStrokeAt(wbCurrentPoints[wbCurrentPoints.length - 1]);
    if (hit) {
      try { await deleteDoc(doc(db, 'whiteboard_elements', hit.id)); }
      catch(err) { toast('지우기 실패: ' + err.message, 'err'); }
    }
    redrawWhiteboardStrokes();
  }
  wbCurrentPoints = [];
}

function simplifyPoints(points) {
  if (points.length <= 80) return points;
  const out = [];
  const step = Math.ceil(points.length / 80);
  for (let i = 0; i < points.length; i += step) out.push(points[i]);
  if (out[out.length - 1] !== points[points.length - 1]) out.push(points[points.length - 1]);
  return out;
}

function findStrokeAt(p) {
  let best = null, bestDist = 14;
  wbElements.filter(e => e.type === 'stroke').forEach(st => {
    (st.points || []).forEach(pt => {
      const d = Math.hypot(pt.x - p.x, pt.y - p.y);
      if (d < bestDist) { bestDist = d; best = st; }
    });
  });
  return best;
}

function redrawWhiteboardStrokes() {
  const canvas = g('wbCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, WB_W, WB_H);
  wbElements.filter(e => e.type === 'stroke').forEach(st => {
    const pts = st.points || [];
    if (pts.length < 2) return;
    ctx.strokeStyle = st.color || '#2563eb';
    ctx.lineWidth = st.width || 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  });
}

function renderWhiteboardObjects() {
  const layer = g('wbObjects');
  if (!layer) return;
  const items = wbElements.filter(e => e.type !== 'stroke');
  layer.innerHTML = items.map(el => wbObjectHtml(el)).join('');
  items.forEach(el => bindWbObjectEvents(el));
}

function wbObjectHtml(el) {
  const cls = 'wb-item author-' + (el.author === '써든리' ? 'sundari' : 'hosea') +
    (wbSelectedId === el.id ? ' selected' : '');
  const style = 'left:' + (el.x||40) + 'px;top:' + (el.y||40) + 'px';
  const del = '<button class="wb-item-del" type="button" data-del="' + el.id + '">×</button>';
  const badge = '<span class="wb-item-badge">' + esc(el.author || '호세') + '</span>';

  if (el.type === 'text') {
    return '<div class="' + cls + ' wb-text" data-id="' + el.id + '" style="' + style + '">' +
      badge + del + '<div class="wb-text-body" contenteditable="true">' + esc(el.text || '텍스트 입력') + '</div></div>';
  }
  if (el.type === 'link') {
    const url = esc(el.url || '');
    return '<div class="' + cls + ' wb-link" data-id="' + el.id + '" style="' + style + '">' +
      badge + del + '<a href="' + url + '" target="_blank" rel="noopener">' + esc(el.label || el.url || '링크') + '</a>' +
      '<div class="wb-link-url">' + url + '</div></div>';
  }
  if (el.type === 'image') {
    return '<div class="' + cls + ' wb-image" data-id="' + el.id + '" style="' + style + '">' +
      badge + del + '<img src="' + escAttr(el.url || '') + '" alt="첨부 이미지"/>' +
      '<div class="wb-image-cap" contenteditable="true">' + esc(el.caption || '이미지 설명') + '</div></div>';
  }
  return '';
}

function bindWbObjectEvents(el) {
  const node = g('wbObjects')?.querySelector('[data-id="' + el.id + '"]');
  if (!node) return;

  node.querySelector('[data-del]')?.addEventListener('click', e => {
    e.stopPropagation();
    deleteWbElement(el.id);
  });

  node.addEventListener('pointerdown', e => {
    if (wbTool !== 'select') return;
    if (e.target.closest('[contenteditable]') || e.target.closest('a')) return;
    e.preventDefault();
    wbSelectedId = el.id;
    wbDragItem = { id: el.id, startX: e.clientX, startY: e.clientY, origX: el.x || 0, origY: el.y || 0 };
    node.setPointerCapture(e.pointerId);
    renderWhiteboardObjects();
  });

  node.addEventListener('pointermove', e => {
    if (!wbDragItem || wbDragItem.id !== el.id) return;
    const dx = e.clientX - wbDragItem.startX;
    const dy = e.clientY - wbDragItem.startY;
    node.style.left = (wbDragItem.origX + dx) + 'px';
    node.style.top = (wbDragItem.origY + dy) + 'px';
  });

  node.addEventListener('pointerup', async e => {
    if (!wbDragItem || wbDragItem.id !== el.id) return;
    const dx = e.clientX - wbDragItem.startX;
    const dy = e.clientY - wbDragItem.startY;
    const nx = Math.max(0, Math.min(WB_W - 100, wbDragItem.origX + dx));
    const ny = Math.max(0, Math.min(WB_H - 60, wbDragItem.origY + dy));
    wbDragItem = null;
    try {
      await updateDoc(doc(db, 'whiteboard_elements', el.id), { x: nx, y: ny, updatedAt: serverTimestamp() });
    } catch(err) { toast('이동 실패: ' + err.message, 'err'); }
  });

  node.addEventListener('click', e => {
    if (wbTool === 'select' || wbTool === 'eraser') {
      e.stopPropagation();
      wbSelectedId = el.id;
      if (wbTool === 'eraser') deleteWbElement(el.id);
      else renderWhiteboardObjects();
    }
  });

  const textBody = node.querySelector('.wb-text-body');
  if (textBody) {
    textBody.addEventListener('blur', async () => {
      const text = textBody.textContent.trim();
      if (text && text !== el.text) {
        try { await updateDoc(doc(db, 'whiteboard_elements', el.id), { text, updatedAt: serverTimestamp() }); }
        catch(err) { toast('텍스트 저장 실패', 'err'); }
      }
    });
  }

  const cap = node.querySelector('.wb-image-cap');
  if (cap) {
    cap.addEventListener('blur', async () => {
      const caption = cap.textContent.trim();
      if (caption !== (el.caption || '')) {
        try { await updateDoc(doc(db, 'whiteboard_elements', el.id), { caption, updatedAt: serverTimestamp() }); }
        catch(err) { toast('설명 저장 실패', 'err'); }
      }
    });
  }
}

async function onWbSurfaceClick(e) {

  if (wbTool === 'text') {

function compressWbImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve(b) : reject(new Error('압축 실패')), 'image/jpeg', 0.82);
      };
      img.onerror = () => reject(new Error('이미지 로드 실패'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('파일 읽기 실패'));
    reader.readAsDataURL(file);
  });
}

function collectWhiteboardText() {
  const lines = ['[화이트보드 아이디어 정리]'];
  const objs = wbElements
    .filter(e => e.type !== 'stroke')
    .sort((a, b) => (a.y || 0) - (b.y || 0));

  objs.forEach(el => {
    if (el.type === 'text' && el.text?.trim()) {
      lines.push('• ' + el.text.trim() + ' (' + el.author + ')');
    }
    if (el.type === 'link') {
      lines.push('• [링크] ' + (el.label || el.url) + ': ' + el.url + ' (' + el.author + ')');
    }
    if (el.type === 'image') {
      lines.push('• [이미지] ' + (el.caption || '첨부 이미지') + ': ' + el.url + ' (' + el.author + ')');
    }
  });

  const strokes = wbElements.filter(e => e.type === 'stroke').length;
  if (strokes) lines.push('• [스케치] 그리기 ' + strokes + '개 포함');
  if (lines.length === 1) lines.push('• (화이트보드에 정리된 텍스트/링크/이미지가 없습니다)');
  return lines.join('\n');
}

function renderInfoBody() {
  const secs = [
    { k:'docs',     t:'📄 자주 쓰는 서류' },
    { k:'links',    t:'🔗 자주 접속하는 사이트' },
    { k:'accounts', t:'💳 계좌 & 결제 정보' },
  ];
  g('info-body').innerHTML = secs.map(s =>
    '<div class="info-sec"><h4>' + s.t + '</h4>' +
    '<div class="ii-list" data-section="' + s.k + '">' +
    (infoData[s.k]||[]).map((item, i) =>
      '<div class="ii" id="ii-' + s.k + '-' + i + '" data-section="' + s.k + '" data-index="' + i + '">' +
      '<span class="ii-grip" draggable="true" title="드래그하여 순서 변경">⠿</span>' +
      '<span class="ii-l">' + esc(item.label) + '</span>' +
      '<span class="ii-v">' +
      (item.val && item.val.startsWith('http')
        ? '<a href="' + esc(item.val) + '" target="_blank">' + esc(item.val.length > 38 ? item.val.slice(0,38)+'…' : item.val) + '</a>'
        : esc(item.val)) +
      '</span>' +
      '<button class="ieb" type="button" onclick="editII(\'' + s.k + '\',' + i + ')">✏️</button>' +
      '</div>'
    ).join('') +
    '</div>' +
    '<button class="iadd" type="button" onclick="addII(\'' + s.k + '\')">+ 항목 추가</button>' +
    '</div>'
  ).join('');
  initInfoDragDrop();
}

let infoDrag = null;

function initInfoDragDrop() {
  qsa('.ii-grip').forEach(grip => {
    grip.addEventListener('dragstart', onInfoDragStart);
    grip.addEventListener('dragend', onInfoDragEnd);
  });
  qsa('.ii-list').forEach(list => {
    list.addEventListener('dragenter', onInfoListDragEnter);
    list.addEventListener('dragover', onInfoListDragOver);
    list.addEventListener('dragleave', onInfoListDragLeave);
    list.addEventListener('drop', onInfoListDrop);
  });
}

function clearInfoDragMarkers() {
  qsa('.ii').forEach(row => row.classList.remove('ii-dragging', 'ii-over', 'ii-drop-before', 'ii-drop-after'));
}

function getInfoRowFromGrip(grip) {
  return grip.closest('.ii');
}

function onInfoDragStart(e) {
  const row = getInfoRowFromGrip(e.currentTarget);
  if (!row) return;
  infoDrag = {
    section: row.dataset.section,
    from: Number(row.dataset.index),
    rowId: row.id
  };
  row.classList.add('ii-dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', infoDrag.section + ':' + infoDrag.from);
  if (e.dataTransfer.setDragImage) {
    e.dataTransfer.setDragImage(row, 16, 16);
  }
}

function onInfoDragEnd() {
  clearInfoDragMarkers();
  infoDrag = null;
}

function onInfoListDragEnter(e) {
  if (!infoDrag) return;
  e.preventDefault();
}

function onInfoListDragOver(e) {
  if (!infoDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.target.closest('.ii');
  if (!row || row.dataset.section !== infoDrag.section) return;

  const rect = row.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  qsa('.ii[data-section="' + infoDrag.section + '"]').forEach(r => {
    r.classList.remove('ii-over', 'ii-drop-before', 'ii-drop-after');
  });
  row.classList.add('ii-over', after ? 'ii-drop-after' : 'ii-drop-before');
  infoDrag.insertAfter = after;
  infoDrag.hoverIndex = Number(row.dataset.index);
}

function onInfoListDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    clearInfoDragMarkers();
  }
}

function onInfoListDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!infoDrag) return;

  const row = e.target.closest('.ii');
  if (!row || row.dataset.section !== infoDrag.section) return;

  const section = infoDrag.section;
  const from = infoDrag.from;
  const list = row.closest('.ii-list');
  const rows = Array.from(list.querySelectorAll('.ii'));
  let to = rows.indexOf(row);
  if (infoDrag.insertAfter) to += 1;
  if (from < to) to -= 1;

  if (from === to) {
    clearInfoDragMarkers();
    infoDrag = null;
    return;
  }

  const arr = infoData[section];
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  clearInfoDragMarkers();
  infoDrag = null;
  renderInfoBody();
}

window.editII = function(k, i) {
  const item = infoData[k][i];
  g('ii-' + k + '-' + i).innerHTML =
    '<input type="text" value="' + esc(item.label) + '" id="el-' + k + '-' + i + '" style="flex:0 0 100px;margin-right:5px"/>' +
    '<input type="text" value="' + esc(item.val) + '" id="ev-' + k + '-' + i + '" style="flex:1"/>' +
    '<button class="ieb" onclick="saveII(\'' + k + '\',' + i + ')">✅</button>' +
    '<button class="ieb" onclick="delII(\'' + k + '\',' + i + ')">🗑</button>';
};
window.saveII = function(k, i) {
  infoData[k][i].label = g('el-' + k + '-' + i).value;
  infoData[k][i].val   = g('ev-' + k + '-' + i).value;
  renderInfoBody();
};
window.delII = function(k, i) { infoData[k].splice(i, 1); renderInfoBody(); };
window.addII = function(k) {
  infoData[k].push({label:'새 항목', val:''});
  renderInfoBody();
  editII(k, infoData[k].length - 1);
};

// ── 유틸 ─────────────────────────────────────────────────────
function g(id)    { return document.getElementById(id); }
function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }
function p2(n)    { return String(n).padStart(2, '0'); }
function td()     { return new Date().toISOString().slice(0, 10); }
function esc(s)   {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function toast(msg, type) {
  const el = g('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTask();
    closeInfo();
    closeDp();
    closeWbSave();
  }
  if (curCat === 'whiteboard') onWbKeyDown(e);
});
</script>
