<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비북스 매니저 대시보드</title>
<style>
:root {
  --navy:#0A1F44; --navy2:#12305e; --bg:#f4f5f7; --surface:#fff;
  --surface2:#f0f1f4; --border:rgba(0,0,0,0.09); --border-s:rgba(0,0,0,0.16);
  --text:#1a1e2e; --muted:#6b7280; --r:10px; --shd:0 2px 10px rgba(10,31,68,.10);
  --c-space:#8B6914; --c-promo:#1A6B3C; --c-owner:#1A4F8B; --c-event:#7B2D8B;
  --c-ops:#8B2020; --c-ext:#2B7B8B; --c-idea:#6B5B2B;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

header{background:var(--navy);color:#fff;padding:0 18px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.hl{display:flex;align-items:center;gap:14px;}
header h1{font-size:15px;font-weight:700;letter-spacing:.4px;}
.today-b{font-size:11px;opacity:.7;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:20px;}
.hr2{display:flex;gap:7px;align-items:center;}
.hb{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.hb-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);}
.hb-ghost:hover{background:rgba(255,255,255,.22);}
.hb-acc{background:#e8f0ea;color:var(--navy);}
.hb-acc:hover{background:#d4e6d8;}
.sdot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:3px;}
.sdot.off{background:#f87171;}
.sstat{font-size:11px;color:rgba(255,255,255,.7);display:flex;align-items:center;}

#setupBanner{background:#fff8e1;border-bottom:2px solid #ffe082;padding:9px 18px;font-size:13px;color:#5d4037;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
#setupBanner.hidden{display:none;}
#setupBanner input{flex:1;min-width:240px;max-width:480px;padding:5px 9px;border:1px solid #ffe082;border-radius:6px;font-size:13px;}
#setupBanner button{padding:5px 12px;background:var(--navy);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;}
#setupBanner .close-btn{background:#999;}

.abar{background:var(--navy2);padding:5px 18px;display:flex;gap:5px;}
.af{padding:3px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,.22);color:rgba(255,255,255,.7);background:transparent;transition:all .15s;}
.af.active{background:#fff;color:var(--navy);border-color:#fff;}

.tbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;display:flex;gap:0;overflow-x:auto;}
.tbar::-webkit-scrollbar{height:2px;}
.tab{padding:9px 13px;border-bottom:2px solid transparent;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap;transition:all .15s;}
.tab.active{border-bottom-color:var(--navy);color:var(--navy);font-weight:700;}
.tab:hover:not(.active){color:var(--text);}

.vbar{padding:8px 18px;display:flex;gap:5px;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);}
.vb{padding:3px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border-s);background:#fff;color:var(--muted);transition:all .15s;}
.vb.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.vbar select{margin-left:auto;padding:3px 7px;border:1px solid var(--border-s);border-radius:6px;font-size:12px;background:#fff;}

.stats{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;}
.sc{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 14px;min-width:80px;}
.sc-l{font-size:11px;color:var(--muted);margin-bottom:2px;}
.sc-v{font-size:20px;font-weight:700;color:var(--navy);}

/* Calendar */
.calw{display:flex;min-height:calc(100vh - 180px);}
.calm{flex:1;padding:14px 18px;min-width:0;overflow-x:auto;}
.calmonths{display:flex;gap:14px;min-width:560px;}
.calmo{flex:1;min-width:260px;}
.calmo-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px;padding:4px 0;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.caldow{background:var(--navy);color:rgba(255,255,255,.85);text-align:center;padding:5px 0;font-size:11px;font-weight:700;}
.caldow:first-child{color:#ffaaaa;}
.caldow:last-child{color:#aaccff;}
.calday{background:#fff;min-height:76px;padding:4px;cursor:pointer;transition:background .1s;overflow:hidden;}
.calday:hover{background:#f0f4ff;}
.calday.today{background:#eff6ff;}
.calday.today .cdn{background:var(--navy);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.calday.om{background:#fafafa;opacity:.5;}
.calday.sun .cdn{color:#dc2626;}
.calday.sat .cdn{color:#2563eb;}
.cdn{font-size:11px;font-weight:600;margin-bottom:2px;line-height:1;}
.chip{font-size:9px;line-height:1.3;padding:1px 3px;border-radius:2px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;display:flex;align-items:center;gap:2px;}
.chip .pd{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.8;flex-shrink:0;}
.calmore{font-size:9px;color:var(--muted);padding:1px 2px;}

/* No-date panel */
.ndp{width:220px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0;}
.ndp-head{padding:10px 12px 7px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ndp-head h3{font-size:12px;font-weight:700;color:var(--navy);}
.ndp-head button{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;}
.ndlist{flex:1;overflow-y:auto;padding:6px;}
.ndc{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin-bottom:5px;cursor:pointer;transition:box-shadow .15s;}
.ndc:hover{box-shadow:var(--shd);}
.ndc-t{font-size:11px;font-weight:600;margin-bottom:3px;}
.ndc-m{display:flex;gap:3px;flex-wrap:wrap;}

/* List view */
.listw{padding:14px 18px;}
.tc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;gap:10px;align-items:flex-start;}
.tc:hover{box-shadow:var(--shd);border-color:var(--border-s);}
.tc.done{opacity:.5;}
.tc.done .tc-t{text-decoration:line-through;}
.tcdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.tcb{flex:1;min-width:0;}
.tc-t{font-size:13px;font-weight:600;margin-bottom:4px;}
.tc-m{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.badge{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:600;}
.bc{color:#fff;}
.ba{background:#e8f0ff;color:#1a4f8b;}
.bs{background:#f0f4f0;color:#1a4f1a;}
.bs.s-진행중{background:#dbeafe;color:#1e40af;}
.bs.s-완료{background:#dcfce7;color:#166534;}
.bs.s-보류{background:#fee2e2;color:#991b1b;}
.tc-date{font-size:11px;color:var(--muted);margin-left:auto;flex-shrink:0;}
.tc-date.ov{color:#dc2626;font-weight:700;}
.tc-memo{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}

/* Date side panel */
.dpanel{position:fixed;right:0;top:0;bottom:0;width:300px;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);z-index:300;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;}
.dpanel.open{transform:translateX(0);}
.dp-head{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.dp-head span{font-size:14px;font-weight:700;}
.dp-head button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}
.dp-body{flex:1;overflow-y:auto;padding:10px;}
.dp-task{background:#f8f9fb;border-radius:7px;padding:9px 11px;margin-bottom:7px;cursor:pointer;}
.dp-task:hover{background:#eef0f5;}
.dp-task-t{font-size:12px;font-weight:600;margin-bottom:3px;}
.dp-addbtn{margin:7px 10px;padding:7px;border:1.5px dashed #ccc;border-radius:7px;background:none;color:var(--muted);font-size:12px;cursor:pointer;width:calc(100% - 20px);}
.dp-addbtn:hover{border-color:var(--navy);color:var(--navy);}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.ov.hidden{display:none;}
.modal{background:#fff;border-radius:13px;padding:22px;width:100%;max-width:510px;max-height:92vh;overflow-y:auto;}
.modal-t{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:var(--navy);}
.mc{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.fg{margin-bottom:11px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 9px;border:1px solid var(--border-s);border-radius:7px;font-size:13px;background:#fff;color:var(--text);font-family:inherit;}
.fg textarea{min-height:65px;resize:vertical;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fa{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;}
.btn{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-p{background:var(--navy);color:#fff;}
.btn-p:hover{background:var(--navy2);}
.btn-s{background:#f0f1f4;color:var(--text);border:1px solid var(--border-s);}
.btn-d{background:#dc2626;color:#fff;}
.ndchk{display:flex;align-items:center;gap:5px;font-size:12px;margin-top:5px;cursor:pointer;}

/* Info modal */
.isec{margin-bottom:18px;}
.isec h4{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.ii{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:12px;}
.ii-l{color:var(--muted);min-width:110px;flex-shrink:0;font-size:11px;}
.ii-v{flex:1;word-break:break-all;}
.ii-v a{color:var(--navy);text-decoration:none;}
.ii-v a:hover{text-decoration:underline;}
.ieb{background:none;border:none;cursor:pointer;font-size:13px;padding:1px;color:var(--muted);}
.iab{margin-top:7px;padding:5px 10px;background:#f0f4ff;border:1px dashed #7b9fd4;border-radius:5px;color:var(--navy);font-size:11px;cursor:pointer;font-weight:600;}

/* Week */
.weekv{padding:14px 18px;}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.wcol{background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.wcol-h{background:var(--navy);color:#fff;text-align:center;padding:5px 3px;font-size:10px;font-weight:700;}
.wcol-h.tc-today{background:#2563eb;}
.wcol-b{padding:5px;min-height:100px;}
.wchip{font-size:9px;padding:2px 4px;border-radius:2px;margin-bottom:2px;color:#fff;cursor:pointer;line-height:1.4;}

#toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:9px 16px;border-radius:7px;font-size:12px;z-index:999;opacity:0;transform:translateY(7px);transition:all .22s;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.ok{background:#166534;}
#toast.err{background:#991b1b;}

@media(max-width:680px){
  .calmonths{flex-direction:column;}
  .ndp{display:none;}
  .fg-row{grid-template-columns:1fr;}
  .wgrid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<header>
  <div class="hl">
    <h1>🟢 BBOOKS MANAGER</h1>
    <span class="today-b" id="todayB"></span>
  </div>
  <div class="hr2">
    <button class="hb hb-ghost" onclick="openInfoModal()">📋 중요 정보</button>
    <button class="hb hb-acc" onclick="openTaskModal()">+ 업무 추가</button>
    <span class="sstat"><span class="sdot off" id="sdot"></span><span id="sstat">미연결</span></span>
    <button class="hb hb-ghost" onclick="syncNow()">↻</button>
  </div>
</header>

<div id="setupBanner">
  <span>⚠️ Google Apps Script URL 입력 시 구글 시트와 실시간 공유됩니다</span>
  <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"/>
  <button onclick="saveApiUrl()">연결</button>
  <button class="close-btn" onclick="document.getElementById('setupBanner').classList.add('hidden')">닫기</button>
</div>

<div class="abar">
  <button class="af active" onclick="setA('전체',this)">전체</button>
  <button class="af" onclick="setA('호세',this)">호세</button>
  <button class="af" onclick="setA('써든리',this)">써든리</button>
</div>

<div class="tbar">
  <div class="tab active" onclick="setTab('cal',this)">📅 캘린더</div>
  <div class="tab" onclick="setTab('all',this)">✅ 전체</div>
  <div class="tab" onclick="setTab('📦 공간&환경',this)">📦 공간&환경</div>
  <div class="tab" onclick="setTab('📣 홍보&마케팅',this)">📣 홍보&마케팅</div>
  <div class="tab" onclick="setTab('🤝 점주&커뮤니티',this)">🤝 점주&커뮤니티</div>
  <div class="tab" onclick="setTab('🎪 모임&행사',this)">🎪 모임&행사</div>
  <div class="tab" onclick="setTab('💰 운영&행정',this)">💰 운영&행정</div>
  <div class="tab" onclick="setTab('🔗 외부연결',this)">🔗 외부연결</div>
  <div class="tab" onclick="setTab('💡 기획&아이디어',this)">💡 기획&아이디어</div>
</div>

<div class="vbar">
  <button class="vb active" onclick="setView('month',this)">월간</button>
  <button class="vb" onclick="setView('week',this)">주간</button>
  <button class="vb" onclick="setView('day',this)">일간</button>
  <select id="sortBy" onchange="render()">
    <option value="created">최신순</option>
    <option value="due">마감일순</option>
    <option value="priority">중요도순</option>
    <option value="assignee">담당자순</option>
  </select>
  <select id="filterSt" onchange="render()">
    <option value="">전체 상태</option>
    <option>예정</option><option>진행중</option><option>완료</option><option>보류</option>
  </select>
</div>

<div class="stats">
  <div class="sc"><div class="sc-l">전체</div><div class="sc-v" id="stTotal">0</div></div>
  <div class="sc"><div class="sc-l">진행중</div><div class="sc-v" id="stIP">0</div></div>
  <div class="sc"><div class="sc-l">완료</div><div class="sc-v" id="stDone">0</div></div>
  <div class="sc"><div class="sc-l" style="color:#dc2626">⚠ 기한초과</div><div class="sc-v" id="stOv" style="color:#dc2626">0</div></div>
</div>

<div id="main"></div>

<!-- Date side panel -->
<div class="dpanel" id="dpanel">
  <div class="dp-head">
    <span id="dp-title">업무</span>
    <button onclick="closeDp()">✕</button>
  </div>
  <div class="dp-body" id="dp-body"></div>
  <button class="dp-addbtn" id="dp-addbtn">+ 이 날짜에 업무 추가</button>
</div>

<!-- Task Modal -->
<div class="ov hidden" id="taskMod">
  <div class="modal">
    <div class="modal-t"><span id="mod-title">업무 추가</span><button class="mc" onclick="closeTaskMod()">✕</button></div>
    <input type="hidden" id="tid"/>
    <div class="fg"><label>제목 *</label><input type="text" id="tT" placeholder="업무 내용 입력"/></div>
    <div class="fg-row">
      <div class="fg"><label>카테고리</label>
        <select id="tC">
          <option value="">선택 안 함</option>
          <option value="📦 공간&환경">📦 공간&환경</option>
          <option value="📣 홍보&마케팅">📣 홍보&마케팅</option>
          <option value="🤝 점주&커뮤니티">🤝 점주&커뮤니티</option>
          <option value="🎪 모임&행사">🎪 모임&행사</option>
          <option value="💰 운영&행정">💰 운영&행정</option>
          <option value="🔗 외부연결">🔗 외부연결</option>
          <option value="💡 기획&아이디어">💡 기획&아이디어</option>
        </select>
      </div>
      <div class="fg"><label>담당자</label>
        <select id="tA"><option>호세</option><option>써든리</option><option>공동</option></select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>중요도</label>
        <select id="tP"><option value="🔴 긴급">🔴 긴급</option><option value="🟡 중요">🟡 중요</option><option value="🟢 일반" selected>🟢 일반</option></select>
      </div>
      <div class="fg"><label>진행상태</label>
        <select id="tS"><option>예정</option><option>진행중</option><option>완료</option><option>보류</option></select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>예상 소요시간</label><input type="text" id="tH" placeholder="예: 2시간"/></div>
      <div class="fg"><label>예상완료일</label>
        <input type="date" id="tD"/>
        <label class="ndchk"><input type="checkbox" id="tND" onchange="togND()"/> 날짜 미정</label>
      </div>
    </div>
    <div class="fg"><label>진행 메모</label><textarea id="tM" placeholder="진행상황, 참고사항 등"></textarea></div>
    <div class="fa">
      <button class="btn btn-d" id="tDel" onclick="delTask()" style="display:none;margin-right:auto">삭제</button>
      <button class="btn btn-s" onclick="closeTaskMod()">취소</button>
      <button class="btn btn-p" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- Info Modal -->
<div class="ov hidden" id="infoMod">
  <div class="modal" style="max-width:580px">
    <div class="modal-t"><span>📋 비북스 중요 정보</span><button class="mc" onclick="closeInfoMod()">✕</button></div>
    <div id="infobody"></div>
    <div class="fa">
      <button class="btn btn-s" onclick="closeInfoMod()">닫기</button>
      <button class="btn btn-p" onclick="saveInfo()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────
var tasks=[], tab='cal', view='month', assignee='전체', selDate=null, editId=null;
var API_URL=localStorage.getItem('bbooksApiUrl')||'';

var CC={'📦 공간&환경':'#8B6914','📣 홍보&마케팅':'#1A6B3C','🤝 점주&커뮤니티':'#1A4F8B','🎪 모임&행사':'#7B2D8B','💰 운영&행정':'#8B2020','🔗 외부연결':'#2B7B8B','💡 기획&아이디어':'#6B5B2B'};
var PC={'🔴 긴급':'#dc2626','🟡 중요':'#d97706','🟢 일반':'#16a34a'};
var PO={'🔴 긴급':0,'🟡 중요':1,'🟢 일반':2};

window.onload=function(){
  var n=new Date();
  document.getElementById('todayB').textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일';
  if(!localStorage.getItem('bbooksTasks')){
    var init=INIT.map(function(t,i){return Object.assign({},t,{id:'loc'+i,created_at:new Date().toISOString()});});
    localStorage.setItem('bbooksTasks',JSON.stringify(init));
  }
  tasks=JSON.parse(localStorage.getItem('bbooksTasks')||'[]');
  if(!localStorage.getItem('bbooksInfo')) localStorage.setItem('bbooksInfo',JSON.stringify(DEF_INFO));
  if(API_URL){
    document.getElementById('setupBanner').classList.add('hidden');
    document.getElementById('sdot').classList.remove('off');
    document.getElementById('sstat').textContent='시트 연결됨';
    syncNow();
  } else { render(); stats(); }
};

// ── API ────────────────────────────────────────────────
function saveApiUrl(){
  var u=document.getElementById('apiUrl').value.trim();
  if(!u.startsWith('https://script.google.com')){toast('올바른 URL을 입력하세요','err');return;}
  API_URL=u; localStorage.setItem('bbooksApiUrl',u);
  document.getElementById('setupBanner').classList.add('hidden');
  document.getElementById('sdot').classList.remove('off');
  document.getElementById('sstat').textContent='시트 연결됨';
  syncNow();
}

async function syncNow(){
  if(!API_URL){render();stats();return;}
  try{
    var r=await fetch(API_URL+'?action=getTasks');
    var d=await r.json();
    if(d&&d.tasks&&d.tasks.length>0){tasks=d.tasks;localStorage.setItem('bbooksTasks',JSON.stringify(tasks));}
    render();stats();toast('구글 시트 동기화 완료','ok');
  }catch(e){render();stats();}
}

async function apiPost(action,body){
  if(!API_URL)return;
  await fetch(API_URL+'?action='+action,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});
}

// ── FILTERS ───────────────────────────────────────────
function setA(a,el){
  assignee=a;
  document.querySelectorAll('.af').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active'); render();
}
function setTab(t,el){
  tab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active'); render();
}
function setView(v,el){
  view=v;
  document.querySelectorAll('.vb').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active'); render();
}

function filtered(){
  var st=document.getElementById('filterSt').value;
  var so=document.getElementById('sortBy').value;
  var f=tasks.filter(function(t){
    if(assignee!=='전체'&&t.assignee!==assignee)return false;
    if(tab!=='cal'&&tab!=='all'&&t.category!==tab)return false;
    if(st&&t.status!==st)return false;
    return true;
  });
  f.sort(function(a,b){
    if(so==='priority')return(PO[a.priority]||2)-(PO[b.priority]||2);
    if(so==='due')return(a.due_date||'z').localeCompare(b.due_date||'z');
    if(so==='assignee')return(a.assignee||'').localeCompare(b.assignee||'');
    return(b.created_at||'').localeCompare(a.created_at||'');
  });
  return f;
}

function stats(){
  var today=new Date().toISOString().slice(0,10);
  var f=filtered();
  document.getElementById('stTotal').textContent=f.length;
  document.getElementById('stIP').textContent=f.filter(function(t){return t.status==='진행중';}).length;
  document.getElementById('stDone').textContent=f.filter(function(t){return t.status==='완료';}).length;
  document.getElementById('stOv').textContent=f.filter(function(t){return t.due_date&&t.due_date<today&&t.status!=='완료';}).length;
}

function render(){
  stats();
  if(tab==='cal'){
    if(view==='month') renderCal();
    else if(view==='week') renderWeek();
    else renderDay();
  } else {
    renderList();
  }
}

// ── CALENDAR ──────────────────────────────────────────
function renderCal(){
  var now=new Date();
  var dts=filtered().filter(function(t){return !!t.due_date;});
  var nds=filtered().filter(function(t){return !t.due_date;});
  document.getElementById('main').innerHTML=
    '<div class="calw">'+
    '<div class="calm"><div class="calmonths">'+
    buildMonth(now.getFullYear(),now.getMonth(),dts)+
    buildMonth(now.getFullYear(),now.getMonth()+1<12?now.getMonth()+1:0,now.getMonth()+1<12?now.getFullYear():now.getFullYear()+1,dts)+
    '</div></div>'+
    '<div class="ndp"><div class="ndp-head"><h3>📌 날짜 미정 ('+nds.length+')</h3>'+
    '<button onclick="openTaskModal(null,true)">+</button></div>'+
    '<div class="ndlist">'+nds.map(ndCard).join('')+'</div></div>'+
    '</div>';
}

function buildMonth(year,month,yearOrTasks,tasksArg){
  // Handle overloaded call: buildMonth(y,m,tasks) or buildMonth(y,m,y2,tasks)
  var dts, yr=year, mo=month;
  if(Array.isArray(yearOrTasks)){dts=yearOrTasks;}
  else{yr=yearOrTasks;dts=tasksArg;}
  // normalize month overflow
  if(mo>11){mo=mo-12;yr=yr+1;}

  var MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var DN=['일','월','화','수','목','금','토'];
  var today=new Date().toISOString().slice(0,10);
  var fd=new Date(yr,mo,1).getDay();
  var ld=new Date(yr,mo+1,0).getDate();
  var pld=new Date(yr,mo,0).getDate();

  var cells='';
  for(var i=fd-1;i>=0;i--) cells+='<div class="calday om"><div class="cdn">'+(pld-i)+'</div></div>';
  for(var d=1;d<=ld;d++){
    var ds=yr+'-'+pad(mo+1)+'-'+pad(d);
    var dow=new Date(yr,mo,d).getDay();
    var isT=ds===today;
    var dt=dts.filter(function(t){return t.due_date===ds;});
    var chips=dt.slice(0,3).map(function(t){
      var bg=CC[t.category]||'#666';
      return '<div class="chip" style="background:'+bg+'" onclick="event.stopPropagation();openTaskModal(\''+t.id+'\')" title="'+e(t.title)+'"><span class="pd"></span>'+e(t.title.slice(0,9))+(t.title.length>9?'…':'')+'</div>';
    }).join('');
    var more=dt.length>3?'<div class="calmore">+' + (dt.length-3)+'개</div>':'';
    cells+='<div class="calday'+(isT?' today':'')+(dow===0?' sun':dow===6?' sat':'') +'" onclick="openDp(\''+ds+'\')">'+'<div class="cdn'+(isT?'':'')+'">'+(isT?'<span style="background:var(--navy);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px">'+d+'</span>':d)+'</div>'+chips+more+'</div>';
  }
  var tot=Math.ceil((fd+ld)/7)*7;
  for(var x=1;x<=tot-(fd+ld);x++) cells+='<div class="calday om"><div class="cdn">'+x+'</div></div>';

  return '<div class="calmo"><div class="calmo-title">'+yr+'년 '+MN[mo]+'</div>'+
    '<div class="calgrid">'+DN.map(function(d){return '<div class="caldow">'+d+'</div>';}).join('')+cells+'</div></div>';
}

function pad(n){return String(n).padStart(2,'0');}

function ndCard(t){
  var bg=CC[t.category]||'#666';
  return '<div class="ndc" onclick="openTaskModal(\''+t.id+'\')"><div class="ndc-t">'+e(t.title)+'</div>'+
    '<div class="ndc-m"><span class="badge bc" style="background:'+bg+'">'+e(t.category||'미분류')+'</span>'+
    '<span class="badge ba">'+e(t.assignee)+'</span>'+
    '<span style="font-size:10px;color:'+(PC[t.priority]||'#666')+'">'+e(t.priority)+'</span></div></div>';
}

// ── WEEK ──────────────────────────────────────────────
function renderWeek(){
  var now=new Date();
  var sw=new Date(now); sw.setDate(now.getDate()-now.getDay());
  var days=[]; for(var i=0;i<7;i++){var d=new Date(sw);d.setDate(sw.getDate()+i);days.push(d);}
  var today=now.toISOString().slice(0,10);
  var DN=['일','월','화','수','목','금','토'];
  var f=filtered().filter(function(t){return t.due_date;});
  var cols=days.map(function(d,i){
    var ds=d.toISOString().slice(0,10);
    var ts=f.filter(function(t){return t.due_date===ds;});
    var isT=ds===today;
    return '<div class="wcol"><div class="wcol-h'+(isT?' tc-today':'')+'">'+DN[i]+'<br>'+(d.getMonth()+1)+'/'+d.getDate()+'</div>'+
      '<div class="wcol-b">'+ts.map(function(t){return '<div class="wchip" style="background:'+(CC[t.category]||'#666')+'" onclick="openTaskModal(\''+t.id+'\')" title="'+e(t.title)+'">'+e(t.title.slice(0,7))+(t.title.length>7?'…':'')+'</div>';}).join('')+'</div></div>';
  }).join('');
  document.getElementById('main').innerHTML='<div class="weekv"><div class="wgrid">'+cols+'</div></div>';
}

}

function tcHTML(t){
  var today=new Date().toISOString().slice(0,10);
  var ov=t.due_date&&t.due_date<today&&t.status!=='완료';
  var bg=CC[t.category]||'#888';
  return '<div class="tc'+(t.status==='완료'?' done':'')+'" onclick="openTaskModal(\''+t.id+'\')">'+
    '<div class="tcdot" style="background:'+(PC[t.priority]||'#888')+'"></div>'+
    '<div class="tcb"><div class="tc-t">'+e(t.title)+'</div>'+
    '<div class="tc-m">'+
    (t.category?'<span class="badge bc" style="background:'+bg+'">'+e(t.category)+'</span>':'')+
    '<span class="badge ba">'+e(t.assignee)+'</span>'+
    '<span class="badge bs s-'+t.status+'">'+e(t.status)+'</span>'+
    (t.estimated_hours?'<span class="badge" style="background:#f0f4f0;color:#444">⏱ '+e(t.estimated_hours)+'</span>':'')+
    '</div>'+(t.memo?'<div class="tc-memo">'+e(t.memo).slice(0,80)+(t.memo.length>80?'…':'')+'</div>':'')+'</div>'+
    (t.due_date?'<div class="tc-date'+(ov?' ov':'')+'">'+t.due_date+(ov?' ⚠':'')+'</div>':
      '<div class="tc-date" style="color:#bbb">날짜 미정</div>')+'</div>';
}

// ── DATE PANEL ────────────────────────────────────────
function openDp(ds){
  selDate=ds;
  document.getElementById('dp-title').textContent=ds+' 업무';
  var ts=filtered().filter(function(t){return t.due_date===ds;});
  document.getElementById('dp-body').innerHTML=ts.length===0?
    '<p style="color:var(--muted);padding:10px">업무가 없습니다.</p>':
    ts.map(function(t){
      var bg=CC[t.category]||'#888';
      return '<div class="dp-task" onclick="openTaskModal(\''+t.id+'\')">'+
        '<div class="dp-task-t">'+e(t.title)+'</div>'+
        '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px">'+
        (t.category?'<span class="badge bc" style="background:'+bg+'">'+e(t.category)+'</span>':'')+
        '<span class="badge ba">'+e(t.assignee)+'</span>'+
        '<span class="badge bs s-'+t.status+'">'+e(t.status)+'</span>'+
        '</div>'+(t.memo?'<div style="font-size:10px;color:var(--muted);margin-top:3px">'+e(t.memo).slice(0,55)+'</div>':'')+'</div>';
    }).join('');
  document.getElementById('dp-addbtn').onclick=function(){openTaskModal(null,false,ds);};
  document.getElementById('dpanel').classList.add('open');
}
function closeDp(){document.getElementById('dpanel').classList.remove('open');selDate=null;}

// ── TASK MODAL ────────────────────────────────────────
function openTaskModal(id,noDate,prefDate){
  noDate=noDate||false; prefDate=prefDate||'';
  editId=id;
  document.getElementById('taskMod').classList.remove('hidden');
  if(id){
    var t=tasks.find(function(x){return x.id===id;});
    if(!t)return;
    document.getElementById('mod-title').textContent='업무 수정';
    document.getElementById('tid').value=t.id;
    document.getElementById('tT').value=t.title||'';
    document.getElementById('tC').value=t.category||'';
    document.getElementById('tA').value=t.assignee||'호세';
    document.getElementById('tP').value=t.priority||'🟢 일반';
    document.getElementById('tS').value=t.status||'예정';
    document.getElementById('tH').value=t.estimated_hours||'';
    document.getElementById('tD').value=t.due_date||'';
    document.getElementById('tND').checked=!t.due_date;
    document.getElementById('tD').disabled=!t.due_date;
    document.getElementById('tM').value=t.memo||'';
    document.getElementById('tDel').style.display='block';
  } else {
    document.getElementById('mod-title').textContent='업무 추가';
    document.getElementById('tid').value='';
    document.getElementById('tT').value='';
    document.getElementById('tC').value=(tab!=='cal'&&tab!=='all')?tab:'';
    document.getElementById('tA').value=(assignee!=='전체')?assignee:'호세';
    document.getElementById('tP').value='🟢 일반';
    document.getElementById('tS').value='예정';
    document.getElementById('tH').value='';
    document.getElementById('tD').value=prefDate;
    document.getElementById('tND').checked=noDate||!prefDate;
    document.getElementById('tD').disabled=noDate||!prefDate;
    document.getElementById('tM').value='';
    document.getElementById('tDel').style.display='none';
  }
}
function closeTaskMod(){document.getElementById('taskMod').classList.add('hidden');editId=null;}
function togND(){document.getElementById('tD').disabled=document.getElementById('tND').checked;if(document.getElementById('tND').checked)document.getElementById('tD').value='';}

async function saveTask(){
  var title=document.getElementById('tT').value.trim();
  if(!title){toast('제목을 입력하세요','err');return;}
  var nd=document.getElementById('tND').checked;
  var isEdit=!!document.getElementById('tid').value;
  var t={
    id:document.getElementById('tid').value,
    title:title,
    category:document.getElementById('tC').value,
    assignee:document.getElementById('tA').value,
    priority:document.getElementById('tP').value,
    status:document.getElementById('tS').value,
    estimated_hours:document.getElementById('tH').value,
    due_date:nd?'':document.getElementById('tD').value,
    memo:document.getElementById('tM').value,
  };
  closeTaskMod();
  if(isEdit){
    var idx=tasks.findIndex(function(x){return x.id===t.id;});
    if(idx!==-1){t.created_at=tasks[idx].created_at;tasks[idx]=t;}
    apiPost('updateTask',t);
  } else {
    t.id='loc'+Date.now(); t.created_at=new Date().toISOString();
    tasks.push(t);
    apiPost('addTask',t);
  }
  localStorage.setItem('bbooksTasks',JSON.stringify(tasks));
  render(); toast('저장됐습니다','ok');
}

async function delTask(){
  if(!confirm('삭제할까요?'))return;
  var id=document.getElementById('tid').value;
  closeTaskMod();
  tasks=tasks.filter(function(t){return t.id!==id;});
  localStorage.setItem('bbooksTasks',JSON.stringify(tasks));
  render(); toast('삭제됐습니다','ok');
  apiPost('deleteTask&id='+id,{});
}

// ── INFO MODAL ────────────────────────────────────────
var infoD=null;
function openInfoModal(){
  infoD=JSON.parse(localStorage.getItem('bbooksInfo')||'null')||JSON.parse(JSON.stringify(DEF_INFO));
  renderInfoBody();
  document.getElementById('infoMod').classList.remove('hidden');
}
function closeInfoMod(){document.getElementById('infoMod').classList.add('hidden');}
function saveInfo(){localStorage.setItem('bbooksInfo',JSON.stringify(infoD));closeInfoMod();toast('저장됐습니다','ok');}

function renderInfoBody(){
  var secs=[{k:'docs',t:'📄 자주 쓰는 서류'},{k:'links',t:'🔗 자주 접속하는 사이트'},{k:'accounts',t:'💳 계좌 & 결제 정보'}];
  document.getElementById('infobody').innerHTML=secs.map(function(s){
    return '<div class="isec"><h4>'+s.t+'</h4>'+
      (infoD[s.k]||[]).map(function(item,i){
        return '<div class="ii" id="ii-'+s.k+'-'+i+'">'+
          '<span class="ii-l">'+e(item.label)+'</span>'+
          '<span class="ii-v">'+(item.val&&item.val.startsWith('http')?
            '<a href="'+e(item.val)+'" target="_blank">'+e(item.val.length>38?item.val.slice(0,38)+'…':item.val)+'</a>':
            e(item.val))+'</span>'+
          '<button class="ieb" onclick="editII(\''+s.k+'\','+i+')">✏️</button></div>';
      }).join('')+
      '<button class="iab" onclick="addII(\''+s.k+'\')">+ 항목 추가</button></div>';
  }).join('');
}
function editII(k,i){
  var item=infoD[k][i];
  document.getElementById('ii-'+k+'-'+i).innerHTML=
    '<input type="text" value="'+e(item.label)+'" id="el-'+k+'-'+i+'" style="flex:0 0 100px;margin-right:5px"/>'+
    '<input type="text" value="'+e(item.val)+'" id="ev-'+k+'-'+i+'" style="flex:1"/>'+
    '<button class="ieb" onclick="saveII(\''+k+'\','+i+')">✅</button>'+
    '<button class="ieb" onclick="delII(\''+k+'\','+i+')">🗑</button>';
}
function saveII(k,i){
  infoD[k][i].label=document.getElementById('el-'+k+'-'+i).value;
  infoD[k][i].val=document.getElementById('ev-'+k+'-'+i).value;
  renderInfoBody();
}
function delII(k,i){infoD[k].splice(i,1);renderInfoBody();}
function addII(k){infoD[k].push({label:'새 항목',val:''});renderInfoBody();editII(k,infoD[k].length-1);}

// ── UTILS ─────────────────────────────────────────────
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='show '+(type||'');
  clearTimeout(el._t); el._t=setTimeout(function(){el.className='';},2500);
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){closeTaskMod();closeInfoMod();closeDp();}
});
</script>
</body>
</html>
