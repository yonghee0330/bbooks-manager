</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div>
        <p class="eyebrow">BBOOKS MANAGER</p>
        <h1>비북스 매니저 대시보드</h1>
        <p id="todayText" class="today-text"></p>
      </div>
      <div class="header-actions">
        <div class="owner-filter" aria-label="담당자 필터">
          <button class="pill active" data-owner-filter="all">전체</button>
          <button class="pill" data-owner-filter="호세">호세</button>
          <button class="pill" data-owner-filter="써든리">써든리</button>
        </div>
        <button id="openInfoModal" class="secondary-button">📋 중요 정보</button>
        <button id="openTaskModal" class="primary-button">+ 업무 추가</button>
      </div>
    </header>

    <nav id="tabMenu" class="tab-menu" aria-label="업무 카테고리 탭"></nav>

    <main>
      <section class="view-toolbar">
        <div class="view-switcher" aria-label="캘린더 보기 전환">
          <button class="segmented-button active" data-view-mode="month">월간</button>
          <button class="segmented-button" data-view-mode="week">주간</button>
          <button class="segmented-button" data-view-mode="day">일간</button>
        </div>
        <div id="calendarRangeTitle" class="range-title"></div>
      </section>

      <section id="calendarView" class="calendar-layout">
        <div class="calendar-main">
          <div id="calendarGridWrap" class="calendar-grid-wrap"></div>
        </div>
        <aside class="undated-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">No Due Date</p>
              <h2>날짜 미정 업무</h2>
            </div>
            <button id="addUndatedTask" class="ghost-button">+ 추가</button>
          </div>
          <p class="panel-help">업무를 드래그해서 캘린더 날짜에 놓거나, 업무를 클릭해 날짜를 선택하세요.</p>
          <div id="undatedList" class="task-stack"></div>
        </aside>
      </section>

      <section id="listView" class="list-view hidden">
        <div class="list-controls">
          <label>
            정렬
            <select id="sortSelect">
              <option value="priority">중요도순</option>
              <option value="date">날짜순</option>
              <option value="owner">담당자순</option>
            </select>
          </label>
          <label>
            진행상태
            <select id="statusFilter">
              <option value="all">전체</option>
              <option value="예정">예정</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
              <option value="보류">보류</option>
            </select>
          </label>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>
    </main>
  </div>

  <aside id="dayPanel" class="day-panel" aria-live="polite">
    <div class="day-panel-header">
      <div>
        <p class="eyebrow">Selected Date</p>
        <h2 id="dayPanelTitle">날짜 업무</h2>
      </div>
      <button id="closeDayPanel" class="icon-button" aria-label="닫기">×</button>
    </div>
    <div id="dayTaskList" class="task-stack"></div>
    <button id="addTaskForDay" class="primary-button wide">이 날짜에 업무 추가</button>
  </aside>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section class="task-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Task Form</p>
          <h2 id="modalTitle">업무 추가</h2>
        </div>
        <button id="closeTaskModal" class="icon-button" aria-label="닫기">×</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-grid">
          <label class="full">
            제목 <span class="required">*</span>
            <input id="taskTitle" type="text" required placeholder="예: 인스타 포스팅 일정 정리">
          </label>

          <label>
            카테고리
            <select id="taskCategory" required></select>
          </label>

          <label>
            담당자
            <select id="taskOwner" required>
              <option value="호세">호세</option>
              <option value="써든리">써든리</option>
              <option value="공동">공동</option>
            </select>
          </label>

          <label>
            중요도
            <select id="taskPriority" required>
              <option value="긴급">🔴 긴급</option>
              <option value="중요">🟡 중요</option>
              <option value="일반">🟢 일반</option>
            </select>
          </label>

          <label>
            예상 소요시간
            <input id="taskDuration" type="text" placeholder="예: 2시간, 반나절">
          </label>

          <label>
            진행상태
            <select id="taskStatus" required>
              <option value="예정">예정</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
              <option value="보류">보류</option>
            </select>
          </label>

          <label>
            예상완료일
            <input id="taskDueDate" type="date">
          </label>

          <label class="checkbox-line">
            <input id="taskUndated" type="checkbox">
            날짜 미정
          </label>

          <label class="full">
            진행메모
            <textarea id="taskMemo" rows="4" placeholder="진행 상황이나 다음 액션을 적어주세요."></textarea>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="deleteTask" class="danger-button hidden">삭제</button>
          <button type="button" id="cancelTaskForm" class="ghost-button">취소</button>
          <button type="submit" class="primary-button">저장</button>
        </div>
      </form>
    </section>
  </div>

  <div id="infoBackdrop" class="modal-backdrop hidden">
    <section class="task-modal info-modal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">

          { id: "site-bmoim-list", label: "비모임 참가자 명단", value: "https://docs.google.com/spreadsheets/d/1C64dZrpedaMX26oPPwDOkG1SJ-IvfADnIH5loE-qYQ4/htmlview" },
          { id: "site-btalks-list", label: "비톡스 참가자 명단", value: "https://docs.google.com/spreadsheets/d/1xpeBQyp8BS874J_AgXYaE2X7gZJ043m_p4f4G7uOxjU/edit" },
          { id: "site-facepass", label: "얼굴패스(입구관리)", value: "https://portal.heygreet.cloud/ko/login" },
          { id: "site-sbiz24", label: "소상공인24", value: "https://sso.sbiz24.kr/" },
          { id: "site-mnuri", label: "문화누리카드 신청", value: "https://www.mnuri.kr/merchmt/merchmtInsert.do" },
          { id: "site-bucheon-pay", label: "부천페이 가맹점", value: "https://gmoney.or.kr/base/gmoney/apply/list" },
          { id: "site-library-point", label: "경기도서관 독서포인트", value: "https://www.library.kr/ggl" }
        ]
      },
      {
        id: "payment",
        title: "💳 계좌 & 결제 정보",
        items: [
          { id: "pay-kakao", label: "카카오뱅크", value: "3333-3725-33252 (비북스)" },
          { id: "pay-bucheon", label: "부천페이", value: "9465-4443-2235-8945" },
          { id: "pay-business-number", label: "사업자번호", value: "697-05-03470" },
          { id: "pay-toss", label: "토스 매장고유번호", value: "2008193578" }
        ]
      }
    ];

    const state = {
      tasks: [],
      importantInfo: [],
      activeTab: "calendar",
      ownerFilter: "all",
      viewMode: "month",
      selectedDate: toDateInputValue(new Date()),
      pendingAssignTaskId: null
    };

    const els = {
      todayText: document.getElementById("todayText"),
      tabMenu: document.getElementById("tabMenu"),
      calendarView: document.getElementById("calendarView"),
      listView: document.getElementById("listView"),
      calendarGridWrap: document.getElementById("calendarGridWrap"),
      calendarRangeTitle: document.getElementById("calendarRangeTitle"),
      undatedList: document.getElementById("undatedList"),
      taskList: document.getElementById("taskList"),
      sortSelect: document.getElementById("sortSelect"),
      statusFilter: document.getElementById("statusFilter"),
      modalBackdrop: document.getElementById("modalBackdrop"),
      taskForm: document.getElementById("taskForm"),
      taskId: document.getElementById("taskId"),
      taskTitle: document.getElementById("taskTitle"),
      taskCategory: document.getElementById("taskCategory"),
      taskOwner: document.getElementById("taskOwner"),
      taskPriority: document.getElementById("taskPriority"),
      taskDuration: document.getElementById("taskDuration"),
      taskStatus: document.getElementById("taskStatus"),
      taskDueDate: document.getElementById("taskDueDate"),
      taskUndated: document.getElementById("taskUndated"),
      taskMemo: document.getElementById("taskMemo"),
      deleteTask: document.getElementById("deleteTask"),
      modalTitle: document.getElementById("modalTitle"),
      infoBackdrop: document.getElementById("infoBackdrop"),
      importantInfoContent: document.getElementById("importantInfoContent"),
      dayPanel: document.getElementById("dayPanel"),
      dayPanelTitle: document.getElementById("dayPanelTitle"),
      dayTaskList: document.getElementById("dayTaskList")
    };

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      els.todayText.textContent = formatLongDate(new Date());
      state.tasks = loadTasks();
      state.importantInfo = loadImportantInfo();
      renderTabs();
      renderCategoryOptions();
      bindEvents();
      render();
    }

    function bindEvents() {
      document.querySelectorAll("[data-owner-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          state.ownerFilter = button.dataset.ownerFilter;
          document.querySelectorAll("[data-owner-filter]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          render();
        });
      });

      document.querySelectorAll("[data-view-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          state.viewMode = button.dataset.viewMode;
          document.querySelectorAll("[data-view-mode]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          renderCalendar();
        });
      });

      document.getElementById("openTaskModal").addEventListener("click", () => openTaskModal());
      document.getElementById("openInfoModal").addEventListener("click", openInfoModal);
      document.getElementById("closeInfoModal").addEventListener("click", closeInfoModal);
      document.getElementById("addUndatedTask").addEventListener("click", () => openTaskModal({ undated: true }));
      document.getElementById("closeTaskModal").addEventListener("click", closeTaskModal);
      document.getElementById("cancelTaskForm").addEventListener("click", closeTaskModal);
      document.getElementById("closeDayPanel").addEventListener("click", closeDayPanel);
      document.getElementById("addTaskForDay").addEventListener("click", () => openTaskModal({ dueDate: state.selectedDate }));
      els.sortSelect.addEventListener("change", renderList);
      els.statusFilter.addEventListener("change", renderList);

      els.taskUndated.addEventListener("change", () => {
        els.taskDueDate.disabled = els.taskUndated.checked;
        if (els.taskUndated.checked) els.taskDueDate.value = "";
      });

      els.modalBackdrop.addEventListener("click", (event) => {
        if (event.target === els.modalBackdrop) closeTaskModal();
      });

      els.infoBackdrop.addEventListener("click", (event) => {
        if (event.target === els.infoBackdrop) closeInfoModal();
      });

      els.taskForm.addEventListener("submit", saveTaskFromForm);
      els.deleteTask.addEventListener("click", deleteCurrentTask);
    }

    function renderTabs() {
      els.tabMenu.innerHTML = categoryTabs.map((tab) => (
        `<button class="tab-button ${tab.id === state.activeTab ? "active" : ""}" data-tab="${tab.id}">${tab.label}</button>`
      )).join("");

      els.tabMenu.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeTab = button.dataset.tab;
          els.tabMenu.querySelectorAll(".tab-button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          render();
        });
      });
    }

    function renderCategoryOptions() {
      els.taskCategory.innerHTML = categories
        .filter((category) => category.id !== "all")
        .map((category) => `<option value="${category.id}">${category.formLabel}</option>`)
        .join("");
    }

    function render() {
      const isCalendar = state.activeTab === "calendar";
      els.calendarView.classList.toggle("hidden", !isCalendar);
      els.listView.classList.toggle("hidden", isCalendar);
      document.querySelector(".view-toolbar").classList.toggle("hidden", !isCalendar);

      if (isCalendar) {
        renderCalendar();
        renderUndated();
      } else {
        renderList();
      }
    }

    function renderCalendar() {
      const today = new Date();
      if (state.viewMode === "month") {
        const currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        els.calendarRangeTitle.textContent = `${formatMonth(currentMonth)} · ${formatMonth(nextMonth)}`;
        els.calendarGridWrap.className = "calendar-grid-wrap two-months";
        els.calendarGridWrap.innerHTML = [currentMonth, nextMonth].map(renderMonthCalendar).join("");
        return;
      }

      const selected = parseDate(state.selectedDate);
      if (state.viewMode === "week") {
        const days = getWeekDays(selected);
        els.calendarRangeTitle.textContent = `${formatShortDate(days[0])} - ${formatShortDate(days[6])}`;
        els.calendarGridWrap.className = "calendar-grid-wrap single-range";
        els.calendarGridWrap.innerHTML = renderRangeCalendar("주간 업무", days);
        return;
      }

      els.calendarRangeTitle.textContent = formatLongDate(selected);
      els.calendarGridWrap.className = "calendar-grid-wrap single-range";
      els.calendarGridWrap.innerHTML = renderRangeCalendar("일간 업무", [selected]);
    }

    function renderMonthCalendar(monthDate) {
      const year = monthDate.getFullYear();
      const month = monthDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
      const cells = [];

      for (let index = 0; index < totalCells; index++) {
        const dayNumber = index - startOffset + 1;
        if (dayNumber < 1 || dayNumber > daysInMonth) {
          cells.push(`<div class="calendar-cell muted"></div>`);
        } else {
          const date = toDateInputValue(new Date(year, month, dayNumber));
          cells.push(renderDateCell(date, dayNumber));
        }
      }

      return `
        <article class="month-card">
          <h2>${formatMonth(monthDate)}</h2>
          <div class="weekday-row">${["일", "월", "화", "수", "목", "금", "토"].map((day) => `<span>${day}</span>`).join("")}</div>
          <div class="month-grid">${cells.join("")}</div>
        </article>
      `;
    }

    function renderRangeCalendar(title, days) {
      return `
        <article class="month-card range-card">
          <h2>${title}</h2>
          <div class="range-grid" style="--range-count: ${days.length}">
            ${days.map((day) => renderDateCell(toDateInputValue(day), formatWeekdayLabel(day))).join("")}
          </div>
        </article>
      `;
    }

    function renderDateCell(date, label) {
      const tasks = getVisibleTasks().filter((task) => task.dueDate === date);
      const isToday = date === toDateInputValue(new Date());

      return `
        <div class="calendar-cell ${isToday ? "today" : ""}" data-date="${date}" ondragover="event.preventDefault()" ondrop="assignDroppedTask(event, '${date}')" onclick="openDayPanel('${date}')">
          <div class="date-number">${label}</div>
          <div class="cell-tasks">
            ${tasks.slice(0, 4).map(renderCalendarTask).join("")}
            ${tasks.length > 4 ? `<span class="more-count">+${tasks.length - 4}개 더</span>` : ""}
          </div>
        </div>
      `;
    }

    function renderCalendarTask(task) {
      const category = getCategory(task.category);
      return `
        <button class="mini-task ${task.status === "완료" ? "done" : ""}" onclick="event.stopPropagation(); openTaskModal({ id: '${task.id}' })">
          <span class="category-dot" style="background:${category.color}"></span>
          <span>${escapeHtml(task.title)}</span>
        </button>
      `;
    }

    function renderUndated() {
      const tasks = getVisibleTasks().filter((task) => !task.dueDate);
      els.undatedList.innerHTML = tasks.length
        ? tasks.map(renderTaskCard).join("")
        : `<p class="empty-state">날짜 미정 업무가 없습니다.</p>`;
      attachTaskCardEvents();
    }

    function renderList() {
      let tasks = getVisibleTasks();
      const status = els.statusFilter.value;
      const sortBy = els.sortSelect.value;

      if (status !== "all") {
        tasks = tasks.filter((task) => task.status === status);
      }

      tasks = [...tasks].sort((a, b) => {
        if (sortBy === "priority") return priorityMap[a.priority].rank - priorityMap[b.priority].rank;
        if (sortBy === "owner") return a.owner.localeCompare(b.owner, "ko");
        return (a.dueDate || "9999-12-31").localeCompare(b.dueDate || "9999-12-31");
      });

      els.taskList.innerHTML = tasks.length
        ? tasks.map(renderTaskCard).join("")
        : `<p class="empty-state">표시할 업무가 없습니다.</p>`;
      attachTaskCardEvents();
    }

    function renderTaskCard(task) {
      const category = getCategory(task.category);
      const dueText = task.dueDate ? formatShortDate(parseDate(task.dueDate)) : "날짜 미정";
      return `
        <article class="task-card ${task.status === "완료" ? "completed" : ""}" draggable="${!task.dueDate}" data-task-id="${task.id}">
          <div class="task-card-top">
            <span class="category-badge" style="--category-color:${category.color}">${category.formLabel}</span>
            <span class="priority">${priorityMap[task.priority].dot} ${task.priority}</span>
          </div>
          <h3>${escapeHtml(task.title)}</h3>
          <div class="task-meta">
            <span>담당 ${task.owner}</span>
            <span>${dueText}</span>
            <span>${task.duration || "소요시간 미정"}</span>
            <span>${task.status}</span>
          </div>
          ${task.memo ? `<p class="task-memo">${escapeHtml(task.memo)}</p>` : ""}
        </article>
      `;
    }

    function attachTaskCardEvents() {
      document.querySelectorAll(".task-card").forEach((card) => {
        const taskId = card.dataset.taskId;
        card.addEventListener("click", () => {
          const task = state.tasks.find((item) => item.id === taskId);
          if (task && !task.dueDate) {
            state.pendingAssignTaskId = taskId;
            document.body.classList.add("assigning-date");
          } else {
            openTaskModal({ id: taskId });
          }
        });
        card.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", taskId);
        });
      });
    }

    function openDayPanel(date) {
      state.selectedDate = date;
      if (state.pendingAssignTaskId) {
        assignTaskDate(state.pendingAssignTaskId, date);
        state.pendingAssignTaskId = null;
        document.body.classList.remove("assigning-date");
        return;
      }

      els.dayPanelTitle.textContent = formatLongDate(parseDate(date));
      const tasks = getVisibleTasks().filter((task) => task.dueDate === date);
      els.dayTaskList.innerHTML = tasks.length
        ? tasks.map(renderTaskCard).join("")
        : `<p class="empty-state">이 날짜의 업무가 없습니다.</p>`;
      attachTaskCardEvents();
      els.dayPanel.classList.add("open");
    }

    function closeDayPanel() {
      els.dayPanel.classList.remove("open");
    }

    function assignDroppedTask(event, date) {
      event.preventDefault();
      event.stopPropagation();
      const taskId = event.dataTransfer.getData("text/plain");
      assignTaskDate(taskId, date);
    }

    function assignTaskDate(taskId, date) {
      state.tasks = state.tasks.map((task) => task.id === taskId ? { ...task, dueDate: date } : task);
      persistTasks();
      render();
      openDayPanel(date);
    }

    function openTaskModal(options = {}) {
      const task = options.id ? state.tasks.find((item) => item.id === options.id) : null;
      els.taskForm.reset();
      els.taskId.value = task?.id || "";
      els.taskTitle.value = task?.title || "";
      els.taskCategory.value = task?.category || "space";
      els.taskOwner.value = task?.owner || "호세";
      els.taskPriority.value = task?.priority || "일반";
      els.taskDuration.value = task?.duration || "";
      els.taskStatus.value = task?.status || "예정";
      els.taskDueDate.value = task?.dueDate || options.dueDate || "";
      els.taskUndated.checked = Boolean(options.undated || (task && !task.dueDate));
      els.taskDueDate.disabled = els.taskUndated.checked;
      els.taskMemo.value = task?.memo || "";
      els.modalTitle.textContent = task ? "업무 수정" : "업무 추가";
      els.deleteTask.classList.toggle("hidden", !task);
      els.modalBackdrop.classList.remove("hidden");
      els.taskTitle.focus();
    }

    function closeTaskModal() {
      els.modalBackdrop.classList.add("hidden");
    }

    function saveTaskFromForm(event) {
      event.preventDefault();
      const id = els.taskId.value || crypto.randomUUID();
      const task = {
        id,
        title: els.taskTitle.value.trim(),
        category: els.taskCategory.value,
        owner: els.taskOwner.value,
        priority: els.taskPriority.value,
        duration: els.taskDuration.value.trim(),
        dueDate: els.taskUndated.checked ? "" : els.taskDueDate.value,
        status: els.taskStatus.value,
        memo: els.taskMemo.value.trim(),
        updatedAt: new Date().toISOString()
      };

      if (!task.title) return;

      const exists = state.tasks.some((item) => item.id === id);
      state.tasks = exists
        ? state.tasks.map((item) => item.id === id ? task : item)
        : [...state.tasks, task];

      persistTasks();
      closeTaskModal();
      render();
      if (task.dueDate) openDayPanel(task.dueDate);
    }

    function deleteCurrentTask() {
      const id = els.taskId.value;
      if (!id || !confirm("이 업무를 삭제할까요?")) return;
      state.tasks = state.tasks.filter((task) => task.id !== id);
      persistTasks();
      closeTaskModal();
      closeDayPanel();
      render();
    }

    function openInfoModal() {
      renderImportantInfo();
      els.infoBackdrop.classList.remove("hidden");
    }

    function closeInfoModal() {
      els.infoBackdrop.classList.add("hidden");
    }

    function renderImportantInfo() {
      els.importantInfoContent.innerHTML = state.importantInfo.map((section) => `
        <article class="info-section">
          <div class="info-section-header">
            <h3>${section.title}</h3>
            <button class="ghost-button small-button" onclick="addInfoItem('${section.id}')">+ 항목 추가</button>
          </div>
          <div class="info-list">
            ${section.items.map((item) => renderInfoItem(section.id, item)).join("")}
          </div>
        </article>
      `).join("");
    }

    function renderInfoItem(sectionId, item) {
      const value = escapeHtml(item.value);
      const valueMarkup = isUrl(item.value)
        ? `<a href="${value}" target="_blank" rel="noopener noreferrer">${value}</a>`
        : `<span>${value}</span>`;

      return `
        <div class="info-item">
          <div>
            <strong>${escapeHtml(item.label)}</strong>
            ${valueMarkup}
          </div>
          <button class="icon-button edit-button" onclick="editInfoItem('${sectionId}', '${item.id}')" aria-label="${escapeHtml(item.label)} 수정">✏️</button>
        </div>
      `;
    }

    function addInfoItem(sectionId) {
      const label = prompt("항목 이름을 입력하세요.");
      if (!label) return;
      const value = prompt("내용 또는 링크를 입력하세요.") || "";
      state.importantInfo = state.importantInfo.map((section) => {
        if (section.id !== sectionId) return section;
        return {
          ...section,
          items: [
            ...section.items,
            {
              id: `info-${Date.now()}`,
              label: label.trim(),
              value: value.trim()
            }
          ]
        };
      });
      persistImportantInfo();
      renderImportantInfo();
    }

    function editInfoItem(sectionId, itemId) {
      const section = state.importantInfo.find((infoSection) => infoSection.id === sectionId);
      const item = section?.items.find((infoItem) => infoItem.id === itemId);
      if (!item) return;

      const label = prompt("항목 이름을 수정하세요.", item.label);
      if (!label) return;
      const value = prompt("내용 또는 링크를 수정하세요.", item.value);
      if (value === null) return;

      state.importantInfo = state.importantInfo.map((infoSection) => {
        if (infoSection.id !== sectionId) return infoSection;
        return {
          ...infoSection,
          items: infoSection.items.map((infoItem) => (
            infoItem.id === itemId
              ? { ...infoItem, label: label.trim(), value: value.trim() }
              : infoItem
          ))
        };
      });
      persistImportantInfo();
      renderImportantInfo();
    }

    function getVisibleTasks() {
      return state.tasks.filter((task) => {
        const ownerMatches = state.ownerFilter === "all" || task.owner === state.ownerFilter || task.owner === "공동";
        const categoryMatches = state.activeTab === "calendar" || state.activeTab === "all" || task.category === state.activeTab;
        return ownerMatches && categoryMatches;
      });
    }

    function loadTasks() {
      const savedTasks = localStorage.getItem(STORAGE_KEY);
      if (savedTasks === null) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initialTasks));
        return [...initialTasks];
      }

      try {
        return JSON.parse(savedTasks) || [];
      } catch (error) {
        console.warn("업무 데이터를 불러오지 못했습니다.", error);
        return [];
      }
    }

    function persistTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    }

    function loadImportantInfo() {
      const savedInfo = localStorage.getItem(INFO_STORAGE_KEY);
      if (savedInfo === null) {
        const defaultInfo = cloneImportantInfo(defaultImportantInfo);
        localStorage.setItem(INFO_STORAGE_KEY, JSON.stringify(defaultInfo));
        return defaultInfo;
      }

      try {
        return JSON.parse(savedInfo) || cloneImportantInfo(defaultImportantInfo);
      } catch (error) {
        console.warn("중요 정보를 불러오지 못했습니다.", error);
        return cloneImportantInfo(defaultImportantInfo);
      }
    }

    function persistImportantInfo() {
      localStorage.setItem(INFO_STORAGE_KEY, JSON.stringify(state.importantInfo));
    }

    function cloneImportantInfo(info) {
      return JSON.parse(JSON.stringify(info));
    }

    function getCategory(id) {
      return categories.find((category) => category.id === id) || categories[1];
    }

    function toDateInputValue(date) {
      const offsetDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return offsetDate.toISOString().slice(0, 10);
    }

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function getWeekDays(date) {
      const start = new Date(date);
      start.setDate(date.getDate() - date.getDay());
      return Array.from({ length: 7 }, (_, index) => {
        const next = new Date(start);
        next.setDate(start.getDate() + index);
        return next;
      });
    }

    function formatLongDate(date) {
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(date);
    }

    function formatShortDate(date) {
      return new Intl.DateTimeFormat("ko-KR", {
        month: "short",
        day: "numeric"
      }).format(date);
    }

    function formatMonth(date) {
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long"
      }).format(date);
    }

    function formatWeekdayLabel(date) {
      const day = new Intl.DateTimeFormat("ko-KR", { weekday: "short" }).format(date);
      return `${date.getDate()}일 ${day}`;
    }

    function isUrl(value) {
      return /^https?:\/\//.test(value);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
</body>
