<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비북스 매니저</title>
<style>
/* ── 변수 ── */
:root {
  --navy: #0A1F44;
  --navy2: #152d5e;
  --navy3: #1e3f7a;
  --green: #1A6B3C;
  --bg: #f2f3f7;
  --card: #ffffff;
  --border: #e2e4ea;
  --text: #1a1e2e;
  --sub: #5a6075;
  --r: 10px;
  --sh: 0 2px 12px rgba(10,31,68,.09);
  --cat1: #8B6914; /* 공간 */
  --cat2: #1A6B3C; /* 홍보 */
  --cat3: #1A4F8B; /* 점주 */
  --cat4: #7B2D8B; /* 행사 */
  --cat5: #8B2020; /* 운영 */
  --cat6: #2B7B8B; /* 외부 */
  --cat7: #6B5B2B; /* 기획 */
  --p0: #dc2626;
  --p1: #d97706;
  --p2: #16a34a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── 헤더 ── */
#hdr {
  background: var(--navy);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 500;
  gap: 8px;
}
#hdr h1 { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .3px; white-space: nowrap; }
.hdr-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.btn-hdr {
  padding: 5px 11px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.btn-ghost { background: rgba(255,255,255,.13); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.btn-ghost:hover { background: rgba(255,255,255,.22); }
.btn-green { background: #e8f5ed; color: var(--green); }
.btn-green:hover { background: #d4eddb; }
.sync-wrap { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,.65); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; transition: background .3s; }
.dot.on { background: #4ade80; }

/* ── API 배너 ── */
#banner {
  background: #fffbeb;
  border-bottom: 2px solid #fcd34d;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #78350f;
}
#banner.hidden { display: none; }
#banner input {
  flex: 1; min-width: 200px; max-width: 460px;
  padding: 5px 9px;
  border: 1px solid #fcd34d;
  border-radius: 6px;
  font-size: 12px;
}
#banner button {
  padding: 5px 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.b-conn { background: var(--navy); color: #fff; }
.b-skip { background: #d1d5db; color: #374151; }

/* ── 담당자 탭 ── */
#abar {
  background: var(--navy2);
  display: flex;
  gap: 4px;
  padding: 5px 16px;
}
.af {
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.65);
  background: transparent;
  transition: all .15s;
}
.af.on { background: #fff; color: var(--navy); border-color: #fff; }

/* ── 카테고리 탭 ── */
#catbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 16px;
}
#catbar::-webkit-scrollbar { height: 0; }
.ct {
  padding: 9px 13px;
  border-bottom: 2.5px solid transparent;
  cursor: pointer;
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}
.ct.on { border-bottom-color: var(--navy); color: var(--navy); font-weight: 700; }
.ct:hover:not(.on) { color: var(--text); }

/* ── 뷰 바 ── */
#vbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 16px;
  flex-wrap: wrap;
}
.vb {
  padding: 3px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--sub);
  transition: all .15s;
}
.vb.on { background: var(--navy); color: #fff; border-color: var(--navy); }
#vbar select {
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
  color: var(--text);
}
.ml { margin-left: auto; }
#searchInput {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  width: 140px;
}

/* ── 통계 ── */
#stats {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  min-width: 75px;
}
.stat-l { font-size: 10px; color: var(--sub); margin-bottom: 2px; }
.stat-v { font-size: 20px; font-weight: 800; color: var(--navy); }
.stat-v.red { color: var(--p0); }

/* ── 로딩 ── */
#loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,31,68,.5);
  z-index: 900;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 4px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 메인 영역 ── */
#main { min-height: calc(100vh - 200px); }

/* ── 캘린더 ── */
.calw { display: flex; }
.calm { flex: 1; padding: 14px 16px; min-width: 0; overflow-x: auto; }
.cal2 { display: flex; gap: 14px; min-width: 540px; }
.cmo { flex: 1; min-width: 260px; }
.cmo-ttl { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.cgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.cdow {
  background: var(--navy);
  color: rgba(255,255,255,.8);
  text-align: center;
  padding: 5px 0;
  font-size: 10px;
  font-weight: 700;
}
.cdow:first-child { color: #fca5a5; }
.cdow:last-child  { color: #93c5fd; }
.cday {
  background: #fff;
  min-height: 80px;
  padding: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background .1s;
}
.cday:hover { background: #eef2ff; }
.cday:hover::after {
  content: '+';
  position: absolute;
  bottom: 2px; right: 4px;
  font-size: 16px;
  color: #c7cde0;
  line-height: 1;
}
.cday.om { background: #f8f9fb; opacity: .45; cursor: default; pointer-events: none; }
.cday.today { background: #eff6ff; }
.cdn {
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.cday.sun .cdn { color: #dc2626; }
.cday.sat .cdn { color: #2563eb; }
.cdn-circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff !important;
  font-size: 11px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 9px;
  line-height: 1.35;
  padding: 1px 3px;
  border-radius: 3px;
  margin-bottom: 1px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.chip:hover { opacity: .82; }
.chip-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.7); flex-shrink: 0; }
.more { font-size: 9px; color: var(--sub); padding: 1px 2px; }

/* ── 날짜 미정 패널 ── */
.ndp {
  width: 210px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--card);
  display: flex;
  flex-direction: column;
}
.ndp-h {
  padding: 10px 12px 7px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ndp-h h3 { font-size: 12px; font-weight: 700; color: var(--navy); }
.ndp-h button {
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.ndlist { flex: 1; overflow-y: auto; padding: 6px; }
.ndc {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 9px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: box-shadow .15s;
}
.ndc:hover { box-shadow: var(--sh); }
.ndc-t { font-size: 11px; font-weight: 700; margin-bottom: 3px; line-height: 1.4; }
.ndc-m { display: flex; gap: 3px; flex-wrap: wrap; }

/* ── 주간뷰 ── */
.weekw { padding: 14px 16px; }
.wgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.wcol { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.wcol-h { background: var(--navy); color: #fff; text-align: center; padding: 5px 3px; font-size: 10px; font-weight: 700; }
.wcol-h.today { background: #2563eb; }
.wcol-b { padding: 5px; min-height: 100px; }
.wchip { font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; color: #fff; cursor: pointer; line-height: 1.4; }
.wchip:hover { opacity: .82; }

/* ── 일간뷰 / 목록뷰 ── */
.listw { padding: 14px 16px; }
.listw h3 { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
.tc {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: box-shadow .15s, border-color .15s;
}
.tc:hover { box-shadow: var(--sh); border-color: #c7cde0; }
.tc.done { opacity: .45; }
.tc.done .tc-t { text-decoration: line-through; }
.tc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.tc-b { flex: 1; min-width: 0; }
.tc-t { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.tc-m { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
.b-cat { color: #fff; }
.b-who { background: #e8f0ff; color: #1a4f8b; }
.b-st  { background: #f0f4f0; color: #1a4f1a; }
.b-st.s-진행중 { background: #dbeafe; color: #1e40af; }
.b-st.s-완료   { background: #dcfce7; color: #166534; }
.b-st.s-보류   { background: #fee2e2; color: #991b1b; }
.tc-date { font-size: 11px; color: var(--sub); margin-left: auto; flex-shrink: 0; white-space: nowrap; }
.tc-date.ov { color: var(--p0); font-weight: 700; }
.tc-memo { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
.empty { text-align: center; padding: 48px; color: var(--sub); font-size: 13px; }
.empty .ei { font-size: 36px; margin-bottom: 10px; }

/* ── 날짜 패널 (사이드) ── */
#dp {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 300px;
  background: var(--card);
  box-shadow: -4px 0 24px rgba(0,0,0,.12);
  z-index: 400;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
#dp.open { transform: translateX(0); }
.dp-head {
  background: var(--navy);
  color: #fff;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dp-head span { font-size: 14px; font-weight: 700; }
.dp-head button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; }
.dp-body { flex: 1; overflow-y: auto; padding: 10px; }
.dp-task { background: #f5f6fa; border-radius: 8px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer; }
.dp-task:hover { background: #eaecf5; }
.dp-task-t { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.dp-add {
  margin: 0 10px 12px;
  padding: 9px;
  border: 1.5px dashed #c7cde0;
  border-radius: 8px;
  background: none;
  color: var(--sub);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  width: calc(100% - 20px);
  transition: all .15s;
}
.dp-add:hover { border-color: var(--navy); color: var(--navy); background: #f0f4ff; }

/* ── 모달 ── */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.ov.hidden { display: none; }
.modal {
  background: var(--card);
  border-radius: 14px;
  padding: 22px;
  width: 100%;
  max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
}
.mod-t {
  font-size: 16px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mc { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--sub); line-height: 1; }
.fg { margin-bottom: 11px; }
.fg label { display: block; font-size: 10px; font-weight: 800; color: var(--sub); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .4px; }
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 13px;
  background: #fff;
  color: var(--text);
  font-family: inherit;
  transition: border-color .15s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--navy); }
.fg textarea { min-height: 68px; resize: vertical; }
.fg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ndchk { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 5px; cursor: pointer; color: var(--sub); }
.fa { display: flex; gap: 7px; justify-content: flex-end; margin-top: 18px; }
.btn { padding: 8px 18px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all .15s; }
.btn-p { background: var(--navy); color: #fff; }
.btn-p:hover { background: var(--navy3); }
.btn-s { background: #f0f1f5; color: var(--text); border: 1px solid var(--border); }
.btn-d { background: #dc2626; color: #fff; }
.btn-d:hover { background: #b91c1c; }

/* ── Info 모달 ── */
.info-sec { margin-bottom: 18px; }
.info-sec h4 { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.ii { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
.ii-l { color: var(--sub); min-width: 110px; flex-shrink: 0; font-size: 11px; }
.ii-v { flex: 1; word-break: break-all; }
.ii-v a { color: var(--navy); text-decoration: none; }
.ii-v a:hover { text-decoration: underline; }
.ieb { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--sub); padding: 1px; }
.ieb:hover { color: var(--navy); }
.iadd { margin-top: 8px; padding: 5px 12px; background: #eff4ff; border: 1px dashed #93b4f0; border-radius: 6px; color: var(--navy); font-size: 11px; font-weight: 700; cursor: pointer; }

/* ── 토스트 ── */
#toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: #111827;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 12px;
  z-index: 999;
  opacity: 0;
  transform: translateY(8px);
  transition: all .22s;
  pointer-events: none;
  max-width: 280px;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok  { background: #166534; }
#toast.err { background: #991b1b; }

/* ── 반응형 ── */
@media (max-width: 700px) {
  .cal2 { flex-direction: column; }
  .ndp { display: none; }
  .wgrid { grid-template-columns: repeat(4,1fr); }
  .fg-2 { grid-template-columns: 1fr; }
  #dp { width: 90vw; }
  #searchInput { width: 100px; }
}
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="loading"><div class="spinner"></div><span id="load-msg">불러오는 중...</span></div>

<!-- 헤더 -->
<div id="hdr">
  <h1>🟢 BBOOKS</h1>
  <div class="hdr-r">
    <button class="btn-hdr btn-ghost" onclick="openInfo()">📋 중요 정보</button>
    <button class="btn-hdr btn-green" onclick="openTask()">+ 업무 추가</button>
    <div class="sync-wrap">
      <div class="dot" id="dot"></div>
      <span id="conn-txt">미연결</span>
    </div>
    <button class="btn-hdr btn-ghost" onclick="sync()" id="syncBtn">↻</button>
  </div>
</div>

<!-- API 배너 -->
<div id="banner">
  <span>⚠️ Apps Script URL을 연결하면 구글 시트와 공유됩니다</span>
  <input id="apiInput" type="text" placeholder="https://script.google.com/macros/s/.../exec"/>
  <button class="b-conn" onclick="connect()">연결</button>
  <button class="b-skip" onclick="skip()">로컬만 사용</button>
</div>

<!-- 담당자 -->
<div id="abar">
  <button class="af on" onclick="setA('전체',this)">전체</button>
  <button class="af"    onclick="setA('호세',this)">호세</button>
  <button class="af"    onclick="setA('써든리',this)">써든리</button>
</div>

<!-- 카테고리 탭 -->
<div id="catbar">
  <div class="ct on"  onclick="setCat('all',this)">✅ 전체</div>
  <div class="ct" onclick="setCat('📦 공간&환경',this)">📦 공간</div>
  <div class="ct" onclick="setCat('📣 홍보&마케팅',this)">📣 홍보</div>
  <div class="ct" onclick="setCat('🤝 점주&커뮤니티',this)">🤝 점주</div>
  <div class="ct" onclick="setCat('🎪 모임&행사',this)">🎪 행사</div>
  <div class="ct" onclick="setCat('💰 운영&행정',this)">💰 운영</div>
  <div class="ct" onclick="setCat('🔗 외부연결',this)">🔗 외부</div>
  <div class="ct" onclick="setCat('💡 기획&아이디어',this)">💡 기획</div>
</div>

<!-- 뷰 바 -->
<div id="vbar">
  <button class="vb on" onclick="setView('month',this)">월간</button>
  <button class="vb"    onclick="setView('week',this)">주간</button>
  <button class="vb"    onclick="setView('day',this)">일간</button>
  <button class="vb"    onclick="setView('list',this)">목록</button>
  <select id="sortSel" onchange="render()">
    <option value="due">마감일순</option>
    <option value="priority">중요도순</option>
    <option value="created">최신순</option>
  </select>
  <select id="stSel" onchange="render()">
    <option value="">전체 상태</option>

function connect() {
  var u = document.getElementById('apiInput').value.trim();
  if (!u.startsWith('https://script.google.com')) {
    toast('올바른 Apps Script URL이 아닙니다', 'err'); return;
  }

function setConnected(on) {

  document.getElementById('conn-txt').textContent = on ? '시트 연결됨' : '로컬 전용';
}

// ══════════════════════════════════════════════════════════════
// JSONP API 호출 (GET)
// ══════════════════════════════════════════════════════════════
function jsonpGet(action, cb) {
  if (!API) { cb(null, null); return; }
  var name = '_cb' + Date.now() + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var done = false;
  var timer = setTimeout(function() {
    if (done) return;
    done = true;
    cleanup();
    cb(new Error('timeout'), null);
  }, 15000);

  window[name] = function(data) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    cleanup();
    cb(null, data);
  };
  s.onerror = function() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    cleanup();
    cb(new Error('script error'), null);
  };
  function cleanup() {
    delete window[name];
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  s.src = API + '?action=' + action + '&callback=' + name + '&_=' + Date.now();
  document.head.appendChild(s);
}

// POST (no-cors — 응답 읽기 불가하지만 시트에는 저장됨)
function apiPost(action, body) {
  if (!API) return;
  fetch(API + '?action=' + action, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  }).catch(function() {});
}

// ══════════════════════════════════════════════════════════════
// 동기화
// ══════════════════════════════════════════════════════════════
function sync() {
  if (!API) return;
  loading(true, '구글 시트에서 불러오는 중...');
  document.getElementById('syncBtn').textContent = '...';

  jsonpGet('getTasks', function(err, data) {
    if (!err && data && Array.isArray(data.tasks)) {
      tasks = data.tasks.map(norm);
    }
    // info도 가져오기
    jsonpGet('getInfo', function(err2, info) {
      if (!err2 && info && info.content) {
        try { infoData = JSON.parse(info.content); } catch(e) {}
      }
      if (!infoData) infoData = clone(DEFAULT_INFO);
      loading(false);
      document.getElementById('syncBtn').textContent = '↻';
      render(); stats();
      toast(err ? '연결 실패 — 로컬 표시' : '동기화 완료', err ? 'err' : 'ok');
    });
  });
}

// 날짜 정규화
function norm(t) {
  var d = t.due_date || '';
  if (d.length > 10) d = d.slice(0, 10);
  return Object.assign({}, t, { due_date: d });
}

// ══════════════════════════════════════════════════════════════
// 필터 / 정렬
// ══════════════════════════════════════════════════════════════
function setA(a, el) {
  curA = a;
  qsa('.af').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
  render();
}
function setCat(c, el) {
  curCat = c;
  qsa('.ct').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
  render();
}
function setView(v, el) {
  curView = v;
  qsa('.vb').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
  render();
}

function filtered() {
  var st  = g('stSel').value;
  var so  = g('sortSel').value;
  var q   = g('searchInput').value.toLowerCase();
  var today = td();

  var f = tasks.filter(function(t) {
    if (curA !== '전체' && t.assignee !== curA) return false;
    if (curCat !== 'all' && t.category !== curCat) return false;
    if (st && t.status !== st) return false;
    if (q && !t.title.toLowerCase().includes(q) && !(t.memo||'').toLowerCase().includes(q)) return false;
    return true;
  });

  f.sort(function(a, b) {
    if (so === 'priority') return (P_ORDER[a.priority]||2) - (P_ORDER[b.priority]||2);
    if (so === 'due') return (a.due_date||'z').localeCompare(b.due_date||'z');
    return (b.created_at||'').localeCompare(a.created_at||'');
  });
  return f;
}

function stats() {
  var today = td();
  var f = filtered();
  g('s0').textContent = f.length;
  g('s1').textContent = f.filter(function(t){ return t.status==='진행중'; }).length;
  g('s2').textContent = f.filter(function(t){ return t.status==='완료'; }).length;
  g('s3').textContent = f.filter(function(t){ return t.due_date && t.due_date<today && t.status!=='완료'; }).length;
}

// ══════════════════════════════════════════════════════════════
// 렌더링 진입점
// ══════════════════════════════════════════════════════════════
function render() {
  stats();
  if (curView === 'month') renderMonth();
  else if (curView === 'week')  renderWeek();
  else if (curView === 'day')   renderDay();
  else renderList(filtered());
}

// ══════════════════════════════════════════════════════════════
// 월간 캘린더
// ══════════════════════════════════════════════════════════════
function renderMonth() {
  var now = new Date();
  var y1 = now.getFullYear(), m1 = now.getMonth();
  var m2 = m1 + 1, y2 = y1;
  if (m2 > 11) { m2 = 0; y2++; }

  var dated = filtered().filter(function(t){ return !!t.due_date; });
  var nodate = filtered().filter(function(t){ return !t.due_date; });

  g('main').innerHTML =
    '<div class="calw">' +
    '<div class="calm"><div class="cal2">' +
    buildMo(y1, m1, dated) +
    buildMo(y2, m2, dated) +
    '</div></div>' +
    '<div class="ndp">' +
    '<div class="ndp-h"><h3>📌 날짜 미정 (' + nodate.length + ')</h3>' +
    '<button onclick="openTask(null,true)">+</button></div>' +
    '<div class="ndlist">' + nodate.map(ndCard).join('') + '</div>' +
    '</div></div>';
}

function buildMo(yr, mo, dated) {
  var fd  = new Date(yr, mo, 1).getDay();
  var ld  = new Date(yr, mo+1, 0).getDate();
  var pld = new Date(yr, mo, 0).getDate();
  var today = td();
  var cells = '';

  // 이전 달 빈칸
  for (var i = fd-1; i >= 0; i--)
    cells += '<div class="cday om"><div class="cdn">' + (pld-i) + '</div></div>';

  // 현재 달
  for (var d = 1; d <= ld; d++) {
    var ds  = yr + '-' + p2(mo+1) + '-' + p2(d);
    var dow = new Date(yr, mo, d).getDay();
    var isT = ds === today;
    var dt  = dated.filter(function(t){ return t.due_date === ds; });
    var chips = dt.slice(0, 3).map(function(t) {
      var bg = CAT_COLOR[t.category] || '#555';
      var id = esc(t.id);
      return '<div class="chip" style="background:' + bg + '" ' +
        'onclick="event.stopPropagation();openTask(\'' + id + '\')" ' +
        'title="' + esc(t.title) + '">' +
        '<span class="chip-dot"></span>' +
        esc(t.title.slice(0,12)) + (t.title.length > 12 ? '…' : '') +
        '</div>';
    }).join('');
    var more = dt.length > 3 ? '<div class="more">+' + (dt.length-3) + '개 더</div>' : '';
    var numH = isT ? '<span class="cdn-circle">' + d + '</span>' : d;

    cells += '<div class="cday' +
      (isT ? ' today' : '') +
      (dow===0 ? ' sun' : dow===6 ? ' sat' : '') +
      '" onclick="openDp(\'' + ds + '\')">' +
      '<div class="cdn">' + numH + '</div>' +
      chips + more + '</div>';
  }

  // 다음 달 빈칸
  var total = Math.ceil((fd + ld) / 7) * 7;
  for (var x = 1; x <= total - (fd + ld); x++)
    cells += '<div class="cday om"><div class="cdn">' + x + '</div></div>';

  return '<div class="cmo"><div class="cmo-ttl">' + yr + '년 ' + MON[mo] + '</div>' +
    '<div class="cgrid">' +
    DOW.map(function(d){ return '<div class="cdow">' + d + '</div>'; }).join('') +
    cells + '</div></div>';
}

function ndCard(t) {
  var bg = CAT_COLOR[t.category] || '#666';
  return '<div class="ndc" onclick="openTask(\'' + esc(t.id) + '\')">' +
    '<div class="ndc-t">' + esc(t.title) + '</div>' +
    '<div class="ndc-m">' +
    (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
    '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
    '<span style="font-size:10px;color:' + (P_COLOR[t.priority]||'#888') + '">' + esc(t.priority) + '</span>' +
    '</div></div>';
}

// ══════════════════════════════════════════════════════════════
// 주간 뷰
// ══════════════════════════════════════════════════════════════
function renderWeek() {
  var now = new Date();
  var sw = new Date(now); sw.setDate(now.getDate() - now.getDay());
  var days = [];
  for (var i = 0; i < 7; i++) { var dd = new Date(sw); dd.setDate(sw.getDate()+i); days.push(dd); }
  var today = td();
  var dated = filtered().filter(function(t){ return !!t.due_date; });

  var cols = days.map(function(dd, i) {
    var ds = dd.toISOString().slice(0,10);
    var ts = dated.filter(function(t){ return t.due_date === ds; });
    var isT = ds === today;
    return '<div class="wcol">' +
      '<div class="wcol-h' + (isT?' today':'') + '">' + DOW[i] + '<br>' + (dd.getMonth()+1) + '/' + dd.getDate() + '</div>' +
      '<div class="wcol-b">' +
      ts.map(function(t) {
        var bg = CAT_COLOR[t.category] || '#666';
        return '<div class="wchip" style="background:' + bg + '" onclick="openTask(\'' + esc(t.id) + '\')" title="' + esc(t.title) + '">' +
          esc(t.title.slice(0,8)) + (t.title.length>8?'…':'') + '</div>';
      }).join('') +
      '</div></div>';
  }).join('');

  g('main').innerHTML = '<div class="weekw"><div class="wgrid">' + cols + '</div></div>';
}

// ══════════════════════════════════════════════════════════════
// 일간 뷰

function renderDay() {
  var today = td();

  g('main').innerHTML =
    '<div class="listw"><h3>오늘의 업무 — ' + today + '</h3>' +
    (ts.length === 0
      ? '<div class="empty"><div class="ei">📭</div>오늘 예정된 업무가 없습니다.</div>'
      : ts.map(tcHTML).join('')) +
    '</div>';
}

// ══════════════════════════════════════════════════════════════
// 목록 뷰
// ══════════════════════════════════════════════════════════════
function renderList(f) {

      ? '<div class="empty"><div class="ei">📭</div>업무가 없습니다.</div>'
      : f.map(tcHTML).join('')) +
    '</div>';
}

function tcHTML(t) {
  var today = td();
  var ov  = t.due_date && t.due_date < today && t.status !== '완료';
  var bg  = CAT_COLOR[t.category] || '#888';
  var pc  = P_COLOR[t.priority]   || '#888';
  return '<div class="tc' + (t.status==='완료'?' done':'') + '" onclick="openTask(\'' + esc(t.id) + '\')">' +
    '<div class="tc-dot" style="background:' + pc + '"></div>' +
    '<div class="tc-b">' +
    '<div class="tc-t">' + esc(t.title) + '</div>' +
    '<div class="tc-m">' +
    (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
    '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
    '<span class="badge b-st s-' + t.status + '">' + esc(t.status) + '</span>' +
    (t.estimated_hours ? '<span class="badge" style="background:#f0f4f0;color:#555">⏱ ' + esc(t.estimated_hours) + '</span>' : '') +
    '</div>' +
    (t.memo ? '<div class="tc-memo">' + esc(t.memo).slice(0,90) + (t.memo.length>90?'…':'') + '</div>' : '') +
    '</div>' +
    (t.due_date
      ? '<div class="tc-date' + (ov?' ov':'') + '">' + t.due_date + (ov?' ⚠':'') + '</div>'
      : '<div class="tc-date" style="color:#bbb">미정</div>') +
    '</div>';
}

// ══════════════════════════════════════════════════════════════
// 날짜 사이드 패널
// ══════════════════════════════════════════════════════════════
function openDp(ds) {
  selDate = ds;
  g('dp-ttl').textContent = ds;
  var ts = filtered().filter(function(t){ return t.due_date === ds; });
  g('dp-body').innerHTML = ts.length === 0
    ? '<p style="padding:12px;color:var(--sub);font-size:12px">이 날짜에 업무가 없습니다.<br>아래 버튼으로 추가하세요.</p>'
    : ts.map(function(t) {
        var bg = CAT_COLOR[t.category] || '#888';
        return '<div class="dp-task" onclick="openTask(\'' + esc(t.id) + '\')">' +
          '<div class="dp-task-t">' + esc(t.title) + '</div>' +
          '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px">' +
          (t.category ? '<span class="badge b-cat" style="background:' + bg + '">' + esc(t.category) + '</span>' : '') +
          '<span class="badge b-who">' + esc(t.assignee) + '</span>' +
          '<span class="badge b-st s-' + t.status + '">' + esc(t.status) + '</span>' +
          '</div>' +
          (t.memo ? '<div style="font-size:10px;color:var(--sub);margin-top:3px">' + esc(t.memo).slice(0,60) + '</div>' : '') +
          '</div>';
      }).join('');
  g('dp-add').onclick = function() { openTask(null, false, ds); };
  g('dp').classList.add('open');
}
function closeDp() { g('dp').classList.remove('open'); selDate = null; }

// ══════════════════════════════════════════════════════════════
// 업무 모달
// ══════════════════════════════════════════════════════════════
function openTask(id, noDate, prefDate) {
  noDate = !!noDate; prefDate = prefDate || '';
  editId = id || null;
  g('taskMod').classList.remove('hidden');

  if (id) {
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    g('mod-ttl').textContent = '업무 수정';
    g('tid').value = t.id;
    g('tT').value  = t.title || '';
    g('tC').value  = t.category || '';
    g('tA').value  = t.assignee || '호세';
    g('tP').value  = t.priority || '🟢 일반';
    g('tS').value  = t.status   || '예정';
    g('tH').value  = t.estimated_hours || '';
    g('tD').value  = t.due_date || '';
    g('tND').checked = !t.due_date;
    g('tD').disabled = !t.due_date;
    g('tM').value  = t.memo || '';
    g('tDel').style.display = 'block';
  } else {
    g('mod-ttl').textContent = '업무 추가';
    g('tid').value = '';
    g('tT').value  = '';
    g('tC').value  = (curCat !== 'all') ? curCat : '';
    g('tA').value  = (curA !== '전체') ? curA : '호세';
    g('tP').value  = '🟢 일반';
    g('tS').value  = '예정';
    g('tH').value  = '';
    g('tD').value  = prefDate;
    g('tND').checked = noDate || !prefDate;
    g('tD').disabled = noDate || !prefDate;
    g('tM').value  = '';
    g('tDel').style.display = 'none';
  }
}
function closeTask() { g('taskMod').classList.add('hidden'); editId = null; }
function togND() {
  g('tD').disabled = g('tND').checked;
  if (g('tND').checked) g('tD').value = '';
}

function saveTask() {
  var title = g('tT').value.trim();
  if (!title) { toast('제목을 입력하세요', 'err'); return; }
  var nd = g('tND').checked;
  var isEdit = !!g('tid').value;

  var t = {
    id:               g('tid').value,
    title:            title,
    category:         g('tC').value,
    assignee:         g('tA').value,
    priority:         g('tP').value,
    status:           g('tS').value,
    estimated_hours:  g('tH').value,
    due_date:         nd ? '' : g('tD').value,
    memo:             g('tM').value,
    created_at:       new Date().toISOString(),
  };

  if (isEdit) {
    var idx = tasks.findIndex(function(x){ return x.id === t.id; });
    if (idx !== -1) { t.created_at = tasks[idx].created_at; tasks[idx] = t; }
    apiPost('updateTask', t);
  } else {
    t.id = 't' + Date.now();
    tasks.push(t);
    apiPost('addTask', t);
  }

  closeTask();
  if (selDate) openDp(selDate); // 패널 열려있으면 갱신
  render();
  toast('저장됐습니다', 'ok');
}

function delTask() {
  if (!confirm('삭제할까요?')) return;
  var id = g('tid').value;
  tasks = tasks.filter(function(t){ return t.id !== id; });
  apiPost('deleteTask', { id: id });
  closeTask(); closeDp();
  render();
  toast('삭제됐습니다', 'ok');
}

// ══════════════════════════════════════════════════════════════
// 중요 정보 모달
// ══════════════════════════════════════════════════════════════
function openInfo() {
  if (!infoData) infoData = clone(DEFAULT_INFO);
  renderInfoBody();
  g('infoMod').classList.remove('hidden');
}
function closeInfo() { g('infoMod').classList.add('hidden'); }

function saveInfo() {
  apiPost('saveInfo', { content: JSON.stringify(infoData) });
  closeInfo();
  toast('중요 정보 저장됐습니다', 'ok');
}

function renderInfoBody() {
  var secs = [
    { k:'docs',     t:'📄 자주 쓰는 서류' },
    { k:'links',    t:'🔗 자주 접속하는 사이트' },
    { k:'accounts', t:'💳 계좌 & 결제 정보' },
  ];
  g('info-body').innerHTML = secs.map(function(s) {
    return '<div class="info-sec"><h4>' + s.t + '</h4>' +
      (infoData[s.k]||[]).map(function(item, i) {
        return '<div class="ii" id="ii-' + s.k + '-' + i + '">' +
          '<span class="ii-l">' + esc(item.label) + '</span>' +
          '<span class="ii-v">' +
          (item.val && item.val.startsWith('http')
            ? '<a href="' + esc(item.val) + '" target="_blank">' + esc(item.val.length > 38 ? item.val.slice(0,38)+'…' : item.val) + '</a>'
            : esc(item.val)) +
          '</span>' +
          '<button class="ieb" onclick="editII(\'' + s.k + '\',' + i + ')">✏️</button>' +
          '</div>';
      }).join('') +
      '<button class="iadd" onclick="addII(\'' + s.k + '\')">+ 항목 추가</button>' +
      '</div>';
  }).join('');
}

function editII(k, i) {
  var item = infoData[k][i];
  g('ii-' + k + '-' + i).innerHTML =
    '<input type="text" value="' + esc(item.label) + '" id="el-' + k + '-' + i + '" style="flex:0 0 100px;margin-right:5px"/>' +
    '<input type="text" value="' + esc(item.val) + '" id="ev-' + k + '-' + i + '" style="flex:1"/>' +
    '<button class="ieb" onclick="saveII(\'' + k + '\',' + i + ')">✅</button>' +
    '<button class="ieb" onclick="delII(\'' + k + '\',' + i + ')">🗑</button>';
}
function saveII(k, i) {
  infoData[k][i].label = g('el-' + k + '-' + i).value;
  infoData[k][i].val   = g('ev-' + k + '-' + i).value;
  renderInfoBody();
}
function delII(k, i) { infoData[k].splice(i, 1); renderInfoBody(); }
function addII(k)    { infoData[k].push({label:'새 항목', val:''}); renderInfoBody(); editII(k, infoData[k].length-1); }

// ══════════════════════════════════════════════════════════════
// 유틸
// ══════════════════════════════════════════════════════════════
function g(id) { return document.getElementById(id); }
function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }
function p2(n) { return String(n).padStart(2,'0'); }
function td() { return new Date().toISOString().slice(0,10); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function loading(show, msg) {
  var el = g('loading');
  el.classList.toggle('show', show);
  if (msg) g('load-msg').textContent = msg;
}

function toast(msg, type) {
  var el = g('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = ''; }, 2600);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeTask(); closeInfo(); closeDp(); }
});
</script>
</body>
</html>
